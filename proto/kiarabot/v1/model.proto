syntax = "proto3";
package kiarabot.v1;
import "google/protobuf/timestamp.proto";
import "kiarabot/v1/common.proto";
import "kiarabot/v1/platform.proto";
import "kiarabot/v1/policy.proto";
import "kiarabot/v1/plugins.proto";
import "kiarabot/v1/model_stream.proto";
import "kiarabot/v1/observations.proto";

// CONTRACT_STATUS: not_implemented - P01 target declaration, no producer.
message ModelMetadata {
  string model_id = 1;
  string alias = 2;
  uint64 config_version = 3;
  LifecycleState state = 4;
  string provider_kind = 5;
}

// CONTRACT_STATUS: not_implemented - P01 target declaration, no producer.
message ModelConfiguration {
  string model_id = 1;
  string alias = 2;
  string provider_kind = 3;
  // HTTP provider URL: no userinfo/query credentials; secrets use RotateProviderSecret.
  string endpoint = 4;
  string provider_model = 5;
  uint32 timeout_ms = 6;
  uint64 version = 7;
  // CONTRACT_STATUS: not_implemented - P11 target read-only projection, no producer.
  LifecycleState state = 8;
  // CONTRACT_STATUS: not_implemented - P11 target trusted per-model admission cap (1..64).
  uint32 max_concurrency = 9;
}

// CONTRACT_STATUS: not_implemented - P01 target declaration, no producer.
message ModelCallRecord {
  string logical_call_id = 1;
  string owner_instance_id = 2;
  string model_id = 3;
  uint64 config_version = 4;
  OperationState state = 5;
  ExecutionOutcome execution_outcome = 6;
  uint64 input_tokens = 7;
  uint64 output_tokens = 8;
  google.protobuf.Timestamp observed_at = 9;
  Error reason = 10;
  // CONTRACT_STATUS: not_implemented - P11 target declaration, no producer.
  uint64 secret_version = 11;
  // CONTRACT_STATUS: not_implemented - P11 target usage provenance (false: token fields are
  // not authoritative provider usage).
  bool usage_known = 12;
  // CONTRACT_STATUS: not_implemented - P11 target conservative billing fact (unknown/timeout/5xx
  // recovery is true; explicit 4xx/429 rejection is false).
  bool may_have_billed = 13;
  // CONTRACT_STATUS: not_implemented - P11 target sanitized upstream request id (<=128, never a
  // secret); empty when absent.
  string provider_request_id = 14;
  // CONTRACT_STATUS: not_implemented - P11 target provider HTTP round-trip in milliseconds; 0
  // when unknown.
  uint32 latency_ms = 15;
  // CONTRACT_STATUS: not_implemented - P11 target UNKNOWN resolution disposition; UNSPECIFIED
  // until ResolveModelCall is applied.
  ModelCallDisposition disposition = 16;
}

// P11 target replay shape for a duplicate logical_call_id. Only FRESH_RESULT carries a result;
// replay dispositions return call metadata and never invoke the provider again.
// CONTRACT_STATUS: not_implemented - P11 target declaration, no producer.
enum ModelChatDisposition {
  MODEL_CHAT_DISPOSITION_UNSPECIFIED = 0;
  FRESH_RESULT = 1;
  REPLAY_IN_PROGRESS = 2;
  REPLAY_TERMINAL = 3;
}

// P11 target UNKNOWN resolution outcome; UNSPECIFIED while the call is unresolved.
// CONTRACT_STATUS: not_implemented - P11 target declaration, no producer.
enum ModelCallDisposition {
  MODEL_CALL_DISPOSITION_UNSPECIFIED = 0;
  NOT_EXECUTED = 1;
  EXECUTED_NOT_BILLED = 2;
  EXECUTED_BILLED = 3;
  ABANDONED = 4;
}

// CONTRACT_STATUS: not_implemented - P01 target declaration, no producer.
message ModelGetModelMetadataRequest {
  RequestContext context = 1;
  string model_id = 2;
  ResourceScope scope = 3;
}

// CONTRACT_STATUS: not_implemented - P01 target declaration, no producer.
message ModelGetModelMetadataResponse {
  ModelMetadata model = 1;
}

// CONTRACT_STATUS: not_implemented - P01 target declaration, no producer.
message ModelListModelMetadataRequest {
  RequestContext context = 1;
  ResourceScope scope = 2;
  SnapshotPage page = 3;
}

// CONTRACT_STATUS: not_implemented - P01 target declaration, no producer.
message ModelListModelMetadataResponse {
  repeated ModelMetadata models = 1;
  SnapshotPage page = 2;
}

// CONTRACT_STATUS: not_implemented - P01 target declaration, no producer.
message ModelUpdateModelRequest {
  RequestContext context = 1;
  ModelConfiguration config = 2;
  optional uint64 expected_version = 3;
}

// CONTRACT_STATUS: not_implemented - P01 target declaration, no producer.
message ModelUpdateModelResponse {
  ModelMetadata model = 1;
  OperationRef operation = 2;
}

// CONTRACT_STATUS: not_implemented - P01 target declaration, no producer.
message ModelRotateProviderSecretRequest {
  RequestContext context = 1;
  string model_id = 2;
  bytes new_secret = 3;
  optional uint64 expected_version = 4;
}

// CONTRACT_STATUS: not_implemented - P01 target declaration, no producer.
message ModelRotateProviderSecretResponse {
  uint64 version = 1;
  OperationRef operation = 2;
}

// CONTRACT_STATUS: not_implemented - P01 target declaration, no producer.
message ModelGatewayChatRequest {
  RequestContext context = 1;
  string logical_call_id = 2;
  string model_id = 3;
  repeated ModelMessage messages = 4;
}

// CONTRACT_STATUS: not_implemented - P01 target declaration, no producer.
message ModelGatewayChatResponse {
  ModelChatResponse result = 1;
  ModelCallRecord call = 2;
  // CONTRACT_STATUS: not_implemented - P11 target replay shape; only FRESH_RESULT carries
  // result, replay dispositions carry call metadata only and never re-call the provider.
  ModelChatDisposition disposition = 3;
}

// CONTRACT_STATUS: not_implemented - P01 target declaration, no producer.
message ModelGetCallStatusRequest {
  RequestContext context = 1;
  string logical_call_id = 2;
  ResourceScope scope = 3;
}

// CONTRACT_STATUS: not_implemented - P01 target declaration, no producer.
message ModelGetCallStatusResponse {
  ModelCallRecord call = 1;
}

// CONTRACT_STATUS: not_implemented - target owner query, producer pending.
message ModelGetOperationRequest {
  RequestContext context = 1;
  OperationRef operation = 2;
}

// CONTRACT_STATUS: not_implemented - target owner query, producer pending.
message ModelGetOperationResponse {
  Operation operation = 1;
}

// CONTRACT_STATUS: not_implemented - target sensitive configuration query, producer pending.
message ModelGetModelConfigurationRequest {
  RequestContext context = 1;
  string model_id = 2;
  ResourceScope scope = 3;
}

// CONTRACT_STATUS: not_implemented - never returns provider credentials or historical secrets.
message ModelGetModelConfigurationResponse {
  ModelConfiguration config = 1;
  bool secret_configured = 2;
  google.protobuf.Timestamp observed_at = 3;
  // CONTRACT_STATUS: not_implemented - P11 target current secret version projection; never
  // returns the secret or derived material.
  uint64 secret_version = 4;
}

// CONTRACT_STATUS: not_implemented - P11 target declaration, no producer.
message ModelDisableModelRequest {
  RequestContext context = 1;
  string model_id = 2;
  optional uint64 expected_version = 3;
}

// CONTRACT_STATUS: not_implemented - P11 target declaration, no producer.
message ModelDisableModelResponse {
  ModelMetadata model = 1;
}

// CONTRACT_STATUS: not_implemented - P11 target declaration, no producer.
message ModelEnableModelRequest {
  RequestContext context = 1;
  string model_id = 2;
  optional uint64 expected_version = 3;
}

// CONTRACT_STATUS: not_implemented - P11 target declaration, no producer.
message ModelEnableModelResponse {
  ModelMetadata model = 1;
}

// CONTRACT_STATUS: not_implemented - P11 target declaration, no producer.
message ModelResolveModelCallRequest {
  RequestContext context = 1;
  string logical_call_id = 2;
  optional uint64 expected_version = 3;
  ModelCallDisposition disposition = 4;
}

// CONTRACT_STATUS: not_implemented - P11 target declaration, no producer.
message ModelResolveModelCallResponse {
  ModelCallRecord call = 1;
}

// CONTRACT_STATUS: not_implemented - P01 target declaration, no producer.
service ModelService {
  rpc GetModelMetadata(ModelGetModelMetadataRequest) returns (ModelGetModelMetadataResponse) {
    option (required_permission) = PERMISSION_MODEL_READ;
    option (requires_idempotency) = false;
    option (default_deadline_ms) = 2000;
    option (max_deadline_ms) = 5000;
    option (requires_online_authorization) = true;
  }
  rpc ListModelMetadata(ModelListModelMetadataRequest) returns (ModelListModelMetadataResponse) {
    option (required_permission) = PERMISSION_MODEL_READ;
    option (requires_idempotency) = false;
    option (default_deadline_ms) = 2000;
    option (max_deadline_ms) = 5000;
    option (requires_online_authorization) = true;
    // P12m: list metadata is scoped to the requested Model resource family; no wildcard.
    option (scope_kinds) = RESOURCE_MODEL;
  }
  rpc UpdateModel(ModelUpdateModelRequest) returns (ModelUpdateModelResponse) {
    option (required_permission) = PERMISSION_MODEL_MANAGE;
    option (requires_idempotency) = true;
    option (default_deadline_ms) = 5000;
    option (max_deadline_ms) = 30000;
    option (requires_online_authorization) = true;
    option (scope_kinds) = RESOURCE_MODEL;
  }
  rpc RotateProviderSecret(ModelRotateProviderSecretRequest) returns (ModelRotateProviderSecretResponse) {
    option (required_permission) = PERMISSION_MODEL_MANAGE;
    option (requires_idempotency) = true;
    option (default_deadline_ms) = 5000;
    option (max_deadline_ms) = 30000;
    option (requires_online_authorization) = true;
    option (scope_kinds) = RESOURCE_MODEL;
  }
  rpc Chat(ModelGatewayChatRequest) returns (ModelGatewayChatResponse) {
    option (required_permission) = PERMISSION_MODEL_CHAT;
    option (requires_idempotency) = false;
    option (default_deadline_ms) = 30000;
    option (max_deadline_ms) = 30000;
    option (requires_online_authorization) = true;
    // Exact business scope is the Model resource family; no instance/namespace widening.
    option (scope_kinds) = RESOURCE_MODEL;
  }
  // CONTRACT_STATUS: not_implemented - STR-01 frozen declaration, producer/consumer pending.
  // Runtime-origin instance delegation only, same owner/fingerprint/deduplication as Chat.
  // Online authorization before admission, first output, at most every 1s, and final release;
  // stop output while checking. Effective deadline also bounds delegation lifetime/config.
  // Cancel/timeout/transport loss after provider dispatch: UNKNOWN, may_have_billed=true unless
  // an authoritative provider result is already committed. Never retry the provider POST.
  // Pre-start failure uses structured RpcFailure trailers; after started use a terminal event
  // and grpc OK. An absent terminal after transport closure means unknown delivery, not failure
  // of any already committed provider fact. Standard HTTP SSE parsing stays in infrastructure.
  rpc ChatStream(ModelGatewayChatRequest) returns (stream ModelStreamEvent) {
    option (required_permission) = PERMISSION_MODEL_CHAT;
    option (requires_idempotency) = false;
    option (default_deadline_ms) = 30000;
    option (max_deadline_ms) = 30000;
    option (requires_online_authorization) = true;
    option (scope_kinds) = RESOURCE_MODEL;
  }
  rpc GetCallStatus(ModelGetCallStatusRequest) returns (ModelGetCallStatusResponse) {
    option (required_permission) = PERMISSION_MODEL_CALL_INSPECT;
    option (requires_idempotency) = false;
    option (default_deadline_ms) = 2000;
    option (max_deadline_ms) = 5000;
    option (requires_online_authorization) = true;
  }
  rpc GetOperation(ModelGetOperationRequest) returns (ModelGetOperationResponse) {
    option (required_permission) = PERMISSION_RESOURCE_READ;
    option (requires_idempotency) = false;
    option (default_deadline_ms) = 2000;
    option (max_deadline_ms) = 5000;
    option (requires_online_authorization) = true;
  }
  // CONTRACT_STATUS: not_implemented - WS-01 owner observation declaration, no producer.
  // Control platform caller + current scoped delegation; never a Runtime-origin plugin method.
  // No cursor captures head with no changes; gap/expired epoch requires CONFLICT+RESYNC_SNAPSHOT.
  rpc ListOperationChanges(OperationChangesRequest) returns (OperationChangesResponse) {
    option (required_permission) = PERMISSION_RESOURCE_READ;
    option (scope_kinds) = RESOURCE_MODEL;
    option (requires_idempotency) = false;
    option (default_deadline_ms) = 500;
    option (max_deadline_ms) = 500;
    option (requires_online_authorization) = true;
  }
  rpc GetModelConfiguration(ModelGetModelConfigurationRequest) returns (ModelGetModelConfigurationResponse) {
    option (required_permission) = PERMISSION_MODEL_MANAGE;
    option (requires_idempotency) = false;
    option (default_deadline_ms) = 2000;
    option (max_deadline_ms) = 5000;
    option (requires_online_authorization) = true;
  }
  rpc DisableModel(ModelDisableModelRequest) returns (ModelDisableModelResponse) {
    option (required_permission) = PERMISSION_MODEL_MANAGE;
    option (requires_idempotency) = true;
    option (default_deadline_ms) = 5000;
    option (max_deadline_ms) = 30000;
    option (requires_online_authorization) = true;
  }
  rpc EnableModel(ModelEnableModelRequest) returns (ModelEnableModelResponse) {
    option (required_permission) = PERMISSION_MODEL_MANAGE;
    option (requires_idempotency) = true;
    option (default_deadline_ms) = 5000;
    option (max_deadline_ms) = 30000;
    option (requires_online_authorization) = true;
  }
  rpc ResolveModelCall(ModelResolveModelCallRequest) returns (ModelResolveModelCallResponse) {
    option (required_permission) = PERMISSION_MODEL_MANAGE;
    option (requires_idempotency) = true;
    option (default_deadline_ms) = 5000;
    option (max_deadline_ms) = 30000;
    option (requires_online_authorization) = true;
  }
}
