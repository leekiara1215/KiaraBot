syntax = "proto3";
package kiarabot.v1;
import "google/protobuf/timestamp.proto";
import "kiarabot/v1/common.proto";
import "kiarabot/v1/platform.proto";
import "kiarabot/v1/policy.proto";

// CONTRACT_STATUS: not_implemented - P01 target declaration, no producer.
message TaskRecord {
  string task_id = 1;
  string owner_instance_id = 2;
  string installation_id = 3;
  ConversationRef target = 4;
  bytes payload = 5;
  google.protobuf.Timestamp run_at = 6;
  ScheduledTaskState state = 7;
  uint64 version = 8;
  string occurrence_id = 9;
  // P10 target observation fields; owner is derived from Runtime delegation, never input.
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp updated_at = 11;
  bool cancel_requested = 12;
  // Stable reason when FAILED (closed ErrorCode); never free-form text.
  Error reason = 13;
}

// CONTRACT_STATUS: not_implemented - P01 target declaration, no producer.
message OccurrenceRecord {
  string occurrence_id = 1;
  string task_id = 2;
  OperationState state = 3;
  HandoffContext handoff = 4;
  string accepted_event_id = 5;
  google.protobuf.Timestamp acknowledged_at = 6;
  // P10 target observation fields.
  // Handoff delivery attempts, 1-based; observation only.
  uint32 attempts = 7;
  // Stable BLOCKED/FAILED reason.
  Error last_error = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;
}

// CONTRACT_STATUS: not_implemented - P01 target declaration, no producer.
message SchedulerCreateTaskRequest {
  RequestContext context = 1;
  string task_id = 2;
  ConversationRef target = 3;
  bytes payload = 4;
  oneof when { google.protobuf.Timestamp run_at = 10; LocalTaskTime local_time = 11; }
}

// CONTRACT_STATUS: not_implemented - P01 target declaration, no producer.
message SchedulerCreateTaskResponse {
  TaskRecord task = 1;
}

// CONTRACT_STATUS: not_implemented - P01 target declaration, no producer.
message SchedulerCancelTaskRequest {
  RequestContext context = 1;
  string task_id = 2;
  ResourceScope scope = 3;
}

// CONTRACT_STATUS: not_implemented - P01 target declaration, no producer.
message SchedulerCancelTaskResponse {
  TaskRecord task = 1;
}

// CONTRACT_STATUS: not_implemented - P01 target declaration, no producer.
message SchedulerGetTaskRequest {
  RequestContext context = 1;
  string task_id = 2;
  ResourceScope scope = 3;
}

// CONTRACT_STATUS: not_implemented - P01 target declaration, no producer.
message SchedulerGetTaskResponse {
  TaskRecord task = 1;
}

// CONTRACT_STATUS: not_implemented - P01 target declaration, no producer.
message SchedulerListTasksRequest {
  RequestContext context = 1;
  ResourceScope scope = 2;
  SnapshotPage page = 3;
  // P10 target optional state filter; absent means no state filter.
  optional ScheduledTaskState state = 4;
}

// CONTRACT_STATUS: not_implemented - P01 target declaration, no producer.
message SchedulerListTasksResponse {
  repeated TaskRecord tasks = 1;
  SnapshotPage page = 2;
}

// CONTRACT_STATUS: not_implemented - P01 target declaration, no producer.
message SchedulerGetOccurrenceRequest {
  RequestContext context = 1;
  string occurrence_id = 2;
  ResourceScope scope = 3;
}

// CONTRACT_STATUS: not_implemented - P01 target declaration, no producer.
message SchedulerGetOccurrenceResponse {
  OccurrenceRecord occurrence = 1;
}

// CONTRACT_STATUS: not_implemented - P01 target declaration, no producer.
message SchedulerGetOperationRequest {
  RequestContext context = 1;
  OperationRef operation = 2;
}

// CONTRACT_STATUS: not_implemented - P01 target declaration, no producer.
message SchedulerGetOperationResponse {
  Operation operation = 1;
}

// CONTRACT_STATUS: not_implemented - P01 target declaration, no producer.
// P10 target semantics (contract frozen, implementation pending):
// - Callers are Runtime with instance delegation or scoped Control; owner_instance/
//   installation are derived from delegation claims, never request input. task_id is
//   unique per owner; cross-instance lookups/cancels return NOT_FOUND.
// - CreateTask returns PENDING. A due claim creates an occurrence and durably enqueues
//   TimerTriggered (trigger outbox); COMPLETED only means the event was durably
//   enqueued, not that a plugin callback succeeded/was ACKed.
// - Time: run_at strictly future and within the configured horizon; local_time rejects
//   nonexistent/ambiguous DST civil times and unknown/path-like IANA zones; tzdata
//   unavailable is UPSTREAM_UNAVAILABLE.
// - Capacity: per-instance 1024 / per-installation 8192 non-terminal tasks; over limit
//   is retryable RATE_LIMITED and does not evict valid receipts.
// - Cancel only before any trigger intent exists (no occurrence/outbox); once handoff
//   started or terminal, CONFLICT without pretending to retract.
// - Handoff: valid_until defaults to 7 days, attempts cap 100; expiry marks occurrence
//   EXPIRED and task FAILED(TIMEOUT, retryable=false); no automatic replay.
service SchedulerService {
  rpc CreateTask(SchedulerCreateTaskRequest) returns (SchedulerCreateTaskResponse) {
    option (required_permission) = PERMISSION_TASK_SCHEDULE;
    option (scope_kinds) = RESOURCE_TASK;
    option (scope_kinds) = RESOURCE_INSTANCE;
    option (requires_idempotency) = true;
    option (default_deadline_ms) = 5000;
    option (max_deadline_ms) = 30000;
    option (requires_online_authorization) = true;
  }
  rpc CancelTask(SchedulerCancelTaskRequest) returns (SchedulerCancelTaskResponse) {
    option (required_permission) = PERMISSION_TASK_SCHEDULE;
    option (scope_kinds) = RESOURCE_TASK;
    option (scope_kinds) = RESOURCE_INSTANCE;
    option (requires_idempotency) = true;
    option (default_deadline_ms) = 5000;
    option (max_deadline_ms) = 30000;
    option (requires_online_authorization) = true;
  }
  rpc GetTask(SchedulerGetTaskRequest) returns (SchedulerGetTaskResponse) {
    option (required_permission) = PERMISSION_TASK_READ;
    option (scope_kinds) = RESOURCE_TASK;
    option (scope_kinds) = RESOURCE_INSTANCE;
    option (requires_idempotency) = false;
    option (default_deadline_ms) = 2000;
    option (max_deadline_ms) = 5000;
    option (requires_online_authorization) = true;
  }
  rpc ListTasks(SchedulerListTasksRequest) returns (SchedulerListTasksResponse) {
    option (required_permission) = PERMISSION_TASK_READ;
    option (scope_kinds) = RESOURCE_TASK;
    option (scope_kinds) = RESOURCE_INSTANCE;
    option (requires_idempotency) = false;
    option (default_deadline_ms) = 2000;
    option (max_deadline_ms) = 5000;
    option (requires_online_authorization) = true;
  }
  rpc GetOccurrence(SchedulerGetOccurrenceRequest) returns (SchedulerGetOccurrenceResponse) {
    option (required_permission) = PERMISSION_TASK_READ;
    option (scope_kinds) = RESOURCE_TASK;
    option (scope_kinds) = RESOURCE_INSTANCE;
    option (requires_idempotency) = false;
    option (default_deadline_ms) = 2000;
    option (max_deadline_ms) = 5000;
    option (requires_online_authorization) = true;
  }
  rpc GetOperation(SchedulerGetOperationRequest) returns (SchedulerGetOperationResponse) {
    option (required_permission) = PERMISSION_TASK_READ;
    option (scope_kinds) = RESOURCE_TASK;
    option (scope_kinds) = RESOURCE_INSTANCE;
    option (requires_idempotency) = false;
    option (default_deadline_ms) = 2000;
    option (max_deadline_ms) = 5000;
    option (requires_online_authorization) = true;
  }
}
