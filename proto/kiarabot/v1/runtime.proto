// CONTRACT_STATUS: not_implemented - controlled bootstrap delivery, no plaintext state.
enum BootstrapDeliveryState {
  BOOTSTRAP_DELIVERY_STATE_UNSPECIFIED = 0;
  BOOTSTRAP_DELIVERY_PENDING = 1;
  BOOTSTRAP_DELIVERY_DELIVERED = 2;
  BOOTSTRAP_DELIVERY_UNKNOWN = 3;
  BOOTSTRAP_DELIVERY_REVOKED = 4;
}

// No credential, digest, filesystem path, owner UID or environment value is public metadata.
// DELIVERED means the version is durably installed at the registered deployment recipient;
// it never means the peer registered, the process ran, or configuration was applied.
// CONTRACT_STATUS: not_implemented - controlled bootstrap delivery.
message BootstrapDelivery {
  string delivery_id = 1;
  ResourceRef resource = 2;
  string recipient_id = 3;
  uint64 credential_version = 4;
  BootstrapDeliveryState state = 5;
  OperationRef operation = 6;
  google.protobuf.Timestamp observed_at = 7;
}

// CONTRACT_STATUS: not_implemented - no-secret delivery query.
message RuntimeGetBootstrapDeliveryRequest {
  RequestContext context = 1;
  ResourceRef resource = 2;
  string delivery_id = 3;
}

// CONTRACT_STATUS: not_implemented - controlled bootstrap delivery metadata.
message RuntimeGetBootstrapDeliveryResponse {
  BootstrapDelivery delivery = 1;
}

// Resource is derived from the current binding; no arbitrary adapter subject is accepted.
// CONTRACT_STATUS: not_implemented - explicit reissue, new identity and expected version.
message RuntimeReissueAdapterBootstrapRequest {
  RequestContext context = 1;
  string account_id = 2;
  string recipient_id = 3;
  optional uint64 expected_credential_version = 4;
}

// CONTRACT_STATUS: not_implemented - explicit reissue, new identity and expected version.
message RuntimeReissuePluginBootstrapRequest {
  RequestContext context = 1;
  string instance_id = 2;
  string recipient_id = 3;
  optional uint64 expected_credential_version = 4;
}

// First committed response only; repeat returns the same metadata/operation but no plaintext.
// Reissue atomically revokes prior digest/version; old proof/refresh fail the current-version
// gate within the existing one-second bound. It never revives old authorization or executions.
// CONTRACT_STATUS: not_implemented - explicit controlled bootstrap reissue.
message RuntimeReissueBootstrapResponse {
  BootstrapDelivery delivery = 1;
  string bootstrap_credential = 2;
  Operation operation = 3;
}

// Submitted only by the registered Control peer, with the original intent/resource/recipient
// and current exact management grant. Report accepts DELIVERED (receipt required) or UNKNOWN;
// callers cannot report REVOKED or make a superseded version current.
// CONTRACT_STATUS: not_implemented - secret-free deployment evidence.
message BootstrapDeliveryReport {
  string delivery_id = 1;
  string recipient_id = 2;
  uint64 credential_version = 3;
  BootstrapDeliveryState state = 4;
  string receipt_id = 5;
  google.protobuf.Timestamp observed_at = 6;
}

// CONTRACT_STATUS: not_implemented - exact account management delivery report.
message RuntimeReportAdapterBootstrapDeliveryRequest {
  RequestContext context = 1;
  string account_id = 2;
  BootstrapDeliveryReport report = 3;
}

// CONTRACT_STATUS: not_implemented - exact plugin management delivery report.
message RuntimeReportPluginBootstrapDeliveryRequest {
  RequestContext context = 1;
  string instance_id = 2;
  BootstrapDeliveryReport report = 3;
}

// Registered Host peer may change only its own admission gate, with current HostBridge fence,
// original Host-owned maintenance intent and exact host.execute grant. No generic Runtime peer
// whitelist expansion; no process launch or business desired-state edit is authorized here.
// Repeated same intent/version/payload returns the same gate; mismatch is CONFLICT.
// CONTRACT_STATUS: not_implemented - Host/Runtime maintenance coordination.
message RuntimeSetHostAdmissionGateRequest {
  RequestContext context = 1;
  string host_id = 2;
  Fence fence = 3;
  OperationRef operation = 4;
  uint64 maintenance_version = 5;
  optional uint64 expected_gate_version = 6;
  HostAdmissionState admission = 7;
}

// CONTRACT_STATUS: not_implemented - Runtime-owned dispatch gate, not Host process evidence.
message RuntimeSetHostAdmissionGateResponse {
  string host_id = 1;
  uint64 gate_version = 2;
  uint64 maintenance_version = 3;
  HostAdmissionState admission = 4;
  OperationRef operation = 5;
}

