syntax = "proto3";
package kiarabot.v1;
import "google/protobuf/descriptor.proto";
import "kiarabot/v1/platform.proto";

// CONTRACT_STATUS: not_implemented - P01 target declaration, no producer.
enum Permission {
  PERMISSION_UNSPECIFIED = 0;
  PERMISSION_ACCOUNT_MANAGE = 1;
  PERMISSION_ACCOUNT_POLICY_MANAGE = 2;
  PERMISSION_ACCOUNT_POLICY_READ = 3;
  PERMISSION_ACTION_EXECUTE = 4;
  PERMISSION_ACTION_INSPECT = 5;
  PERMISSION_ADAPTER_CONNECT = 6;
  PERMISSION_DELIVERY_MANAGE = 7;
  PERMISSION_DELIVERY_PROCESS = 8;
  PERMISSION_HOST_EXECUTE = 9;
  PERMISSION_HOST_READ = 10;
  PERMISSION_HOST_REGISTER = 11;
  PERMISSION_IDENTITY_ASSIGNMENT_MANAGE = 12;
  PERMISSION_IDENTITY_ASSIGNMENT_READ = 13;
  PERMISSION_IDENTITY_AUTHORIZATION_CHECK = 14;
  PERMISSION_IDENTITY_DELEGATION_ISSUE = 15;
  PERMISSION_IDENTITY_INVALIDATION_READ = 16;
  PERMISSION_IDENTITY_KEYS_READ = 17;
  PERMISSION_IDENTITY_PRINCIPAL_MANAGE = 18;
  PERMISSION_IDENTITY_PRINCIPAL_READ = 19;
  PERMISSION_IDENTITY_SESSION_CREATE = 20;
  PERMISSION_IDENTITY_SESSION_READ = 21;
  PERMISSION_IDENTITY_SESSION_REVOKE = 22;
  PERMISSION_MODEL_CALL_INSPECT = 23;
  PERMISSION_MODEL_CHAT = 24;
  PERMISSION_MODEL_MANAGE = 25;
  PERMISSION_MODEL_READ = 26;
  PERMISSION_NAMESPACE_MANAGE = 27;
  PERMISSION_PLUGIN_CONNECT = 28;
  PERMISSION_PLUGIN_MANAGE = 29;
  PERMISSION_RESOURCE_MANAGE = 30;
  PERMISSION_RESOURCE_READ = 31;
  PERMISSION_STORAGE_NAMESPACE = 32;
  PERMISSION_TASK_READ = 33;
  PERMISSION_TASK_SCHEDULE = 34;
  PERMISSION_TIMER_ACCEPT = 35;
  PERMISSION_ACCOUNT_READ = 36;
  PERMISSION_PLUGIN_READ = 37;
  PERMISSION_ADAPTER_READ = 38;
  PERMISSION_PLUGIN_CONFIG_READ = 39;
  // Explicit sensitive grant only: no fixed role or canonical creation policy derives it.
  PERMISSION_MESSAGE_READ = 40;
  // P07 target per-kind Action grants; sensitive explicit grants only. Each applies to the
  // named Action kind on an exact account/resource scope and is never derived from roles.
  PERMISSION_MESSAGE_SEND = 41;
  PERMISSION_MESSAGE_REACT = 42;
  PERMISSION_MESSAGE_DELETE = 43;
  PERMISSION_MEMBER_MUTE = 44;
  PERMISSION_MEMBER_KICK = 45;
  PERMISSION_REQUEST_APPROVE = 46;
  // P09 target shared-namespace management read; explicit installation-scope grant only.
  PERMISSION_NAMESPACE_READ = 47;
  // P12 target Control log/audit read. Sensitive explicit grants only: no fixed role or canonical
  // creation policy derives them, and log.read never grants audit data (and vice versa).
  // CONTRACT_STATUS: not_implemented - target permission declaration, no producer.
  PERMISSION_LOG_READ = 48;
  // CONTRACT_STATUS: not_implemented - target permission declaration, no producer.
  PERMISSION_AUDIT_READ = 49;
  // P12 target authorized per-component health read. The anonymous /health/live and
  // /health/ready probes never need it; the aggregate /api/v1/health requires this explicit
  // grant. CONTRACT_STATUS: not_implemented - target permission declaration, no producer.
  PERMISSION_HEALTH_READ = 50;
}

extend google.protobuf.MethodOptions {
  Permission required_permission = 51001;
  bool requires_idempotency = 51002;
  uint32 default_deadline_ms = 51003;
  bool requires_online_authorization = 51004;
  uint32 max_deadline_ms = 51005;
  // Trusted canonical scope annotation for the descriptor-driven authorization policy resolver.
  // CONTRACT_STATUS: implemented - target method metadata; no payload/field producer is added.
  // Only methods whose exact resource-kind scope is frozen may carry it; absent/empty means the
  // resolver fails closed instead of inferring scope from a request or method spelling.
  repeated ResourceKind scope_kinds = 51006;
}
