message RuntimeToHost {

  oneof body { HostApplyDesiredProcessRequest apply = 10; HostStopExecutionRequest stop = 11; HostDrainHostRequest drain = 12; HostRegisterHostResponse registered = 13; RpcFailure failure = 14; }
}

