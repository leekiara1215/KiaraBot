// CONTRACT_STATUS: not_implemented - P01 target declaration, no producer.
message PrincipalRecord {
  string principal_id = 1;
  ResourceRef binding = 2;
  string principal_kind = 3;
  uint64 version = 4;
  LifecycleState state = 5;
  repeated FixedRole roles = 6;
  ResourceScope scope = 7;
  // Display-only union from current checked assignments; never an authorization basis.
  repeated Permission display_permissions = 8;
}

// CONTRACT_STATUS: not_implemented - P01 target declaration, no producer.
message SessionRecord {
  string session_id = 1;
  string principal_id = 2;
  uint64 rotation = 3;
  google.protobuf.Timestamp expires_at = 4;
  bool revoked = 5;
  // Authoritative creation time; Control must not substitute local time or token iat.
  google.protobuf.Timestamp created_at = 6;
}

// CONTRACT_STATUS: not_implemented - P01 target declaration, no producer.
message TokenPair {
  string session_id = 1;
  string access_token = 2;
  string refresh_token = 3;
  google.protobuf.Timestamp access_expires_at = 4;
  google.protobuf.Timestamp refresh_expires_at = 5;
  uint64 rotation = 6;
}

// CONTRACT_STATUS: not_implemented - P01 target declaration, no producer.
message CredentialDelivery {
  string credential_id = 1;
  uint64 version = 2;
  bytes new_secret = 3;
  string delivery_receipt_id = 4;
  google.protobuf.Timestamp expires_at = 5;
}

// CONTRACT_STATUS: not_implemented - P01 target declaration, no producer.
message AssignmentRecord {
  string assignment_id = 1;
  string principal_id = 2;
  FixedRole role = 3;
  repeated Permission permissions = 4;
  ResourceScope scope = 5;
  uint64 version = 6;
}

// CONTRACT_STATUS: not_implemented - P01 target declaration, no producer.
message DelegationProof {
  string proof = 1;
  string audience = 2;
  google.protobuf.Timestamp expires_at = 3;
  uint32 business_hops = 4;
}

// CONTRACT_STATUS: not_implemented - P01 target declaration, no producer.
message AuthorizationDecision {
  bool allowed = 1;
  uint64 authorization_version = 2;
  google.protobuf.Timestamp checked_at = 3;
  Error denial = 4;
}

// CONTRACT_STATUS: not_implemented - P01 target declaration, no producer.
message InvalidationRecord {
