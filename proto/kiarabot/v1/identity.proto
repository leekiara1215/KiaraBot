// CONTRACT_STATUS: not_implemented - requested basis, never trusted as an authorization decision.
message AssignmentSpec {
  string principal_id = 1;
  // Nonzero only for a human fixed-role grant; then permissions must be empty.
  FixedRole role = 2;
  // Explicit registered permissions require role=UNSPECIFIED (also for non-human principals).
  repeated Permission permissions = 3;
  ResourceScope scope = 4;
}

