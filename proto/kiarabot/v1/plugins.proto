syntax = "proto3";

package kiarabot.v1;

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";
import "kiarabot/v1/actions.proto";
import "kiarabot/v1/common.proto";
import "kiarabot/v1/events.proto";
import "kiarabot/v1/platform.proto";

message PluginManifest {
  string id = 1;
  string name = 2;
  string version = 3;
  string api_version = 4;
  // v1 accepts only "python-rpc"; other runtime names are rejected (CAPABILITY_NOT_SUPPORTED).
  string runtime = 5;
  string entrypoint = 6;
  repeated string capabilities = 7;
  repeated string permissions = 8;
  // CONTRACT_STATUS: not_implemented - a non-empty value is rejected (CAPABILITY_NOT_SUPPORTED).
  repeated string dependencies = 9;
  // CONTRACT_STATUS: not_implemented - only an empty value or "{}" is accepted.
  string config_schema = 10;
  // v1 accepts only "process"; omitted means "process" for the REST validator.
  string isolation = 11;
  bool ordered = 12;
}

enum PluginState {
  PLUGIN_STATE_UNSPECIFIED = 0;
  PLUGIN_STATE_DISABLED = 1;
  // CONTRACT_STATUS: not_implemented - the runtime never produces STARTING/STOPPING.
  PLUGIN_STATE_STARTING = 2;
  PLUGIN_STATE_READY = 3;
  PLUGIN_STATE_RUNNING = 4;
  // CONTRACT_STATUS: not_implemented - the runtime never produces STARTING/STOPPING.
  PLUGIN_STATE_STOPPING = 5;
  PLUGIN_STATE_STOPPED = 6;
  PLUGIN_STATE_UNAVAILABLE = 7;
  PLUGIN_STATE_FAILED = 8;
}

message RegisterPluginRequest {
  PluginManifest manifest = 1;
  string instance_id = 2;
  // Required target features; no legacy event-only admission.
  repeated string supported_features = 3;
  // CONTRACT_STATUS: not_implemented - target authenticated installation binding.
  string installation_id = 4;
  // CONTRACT_STATUS: not_implemented - target execution must be positive.
  optional uint64 execution_generation = 5;
  // CONTRACT_STATUS: not_implemented - target P01.
  RequestContext context = 6;
}

message RegisterPluginResponse {
  bool accepted = 1;
  string required_api_version = 2;
  repeated string granted_permissions = 3;
  Error error = 4;
  // Intersection of requested features and implemented server features.
  repeated string enabled_features = 5;
  // CONTRACT_STATUS: not_implemented - target P01.
  Fence fence = 6;
  // CONTRACT_STATUS: not_implemented - target P01.
  uint64 desired_config_version = 7;
  // CONTRACT_STATUS: not_implemented - required on successful target registration.
  ConnectionAuthorization authorization = 8;
}

// CONTRACT_STATUS: not_implemented - target fence required on post-registration frames.
message PluginToCore {
  Fence fence = 20;
  // CONTRACT_STATUS: not_implemented - mandatory current proof after registration.
  bytes connection_proof = 21;
  oneof body {
    RegisterPluginRequest register = 1;
    PluginEventAck event_ack = 2;
    // P07: the only external plugin Action path (action.result.v1); Runtime unary
    // Action methods are runtime internal dispatcher/test only.
    PluginActionRequest action = 3;
    PluginHeartbeat heartbeat = 4;
    HostRequest host_request = 5;
    PluginActionQuery action_query = 6;
    PluginActionCancel action_cancel = 7;
    // Requires plugin.config.v1; identity is bound to the authenticated stream.
    PluginConfigAck config_ack = 8;
    DeliveryAttempt renew_delivery = 9;
    // CONTRACT_STATUS: not_implemented - same TLS stream only.
    RefreshConnectionAuthorization refresh_authorization = 10;
  }
}

// CONTRACT_STATUS: not_implemented - target lease accompanies event; no bare event admission.
message CoreToPlugin {
  Fence fence = 20;
  DeliveryAttempt delivery_attempt = 21;
  oneof body {
    RegisterPluginResponse register_result = 1;
    EventEnvelope event = 2;
    PluginConfig config = 3;
    PluginHeartbeatAck heartbeat_ack = 4;
    HostResponse host_response = 5;
    // Terminal stream failure; absent frame on disconnect remains unknown outcome.
    Error error = 6;
    // P07: one-question-one-answer response for PluginToCore.action/action_query/action_cancel.
    PluginActionResponse action_response = 7;
    // CONTRACT_STATUS: not_implemented - v1 Core closes the stream without this frame.
    ShutdownNotice shutdown = 8;
    DeliveryReceipt delivery_receipt = 9;
    // CONTRACT_STATUS: not_implemented - rotates connection secrets, not delivery leases.
    ConnectionAuthorizationResult authorization_result = 10;
  }
}

// CONTRACT_STATUS: not_implemented - target attempt required; event-only ACK is invalid.
message PluginEventAck {
  string event_id = 1;
  bool accepted = 2;
  Error error = 3;
  DeliveryAttempt attempt = 4;
}
// action.result.v1 must be enabled before sending any Action operation.
// request_id correlates a call; action.idempotency_key survives reconnects.
// P07 target: the only external plugin Action surface. ActionResult carries execution_outcome;
// Runtime fills action.dispatch_attempt_id/dispatch_sequence when dispatching to adapters.
message PluginActionRequest {
  ActionEnvelope action = 1;
  string request_id = 2;
}
message PluginActionQuery {
  string request_id = 1;
  string trace_id = 2;
  google.protobuf.Timestamp deadline = 3;
  // Scoped to the authenticated plugin. NOT_FOUND does not prove nonexecution.
  oneof selector {
    string action_id = 10;
    string idempotency_key = 11;
  }
}
message PluginActionCancel {
  string request_id = 1;
  string trace_id = 2;
  google.protobuf.Timestamp deadline = 3;
  string action_id = 4;
}
// Exactly one outcome. Query/transport errors never become Action FAILED.
// ACCEPTED is durable but nonterminal; callers query to observe completion.
// No unsolicited final-result push is promised by action.result.v1.
message PluginActionResponse {
  string request_id = 1;
  oneof outcome {
    ActionResult result = 10;
    Error error = 11;
  }
}
message PluginHeartbeat { string instance_id = 1; uint64 sent_at_unix_ms = 2; }
message PluginHeartbeatAck { uint64 received_at_unix_ms = 1; }
// Full desired snapshot; only sent when plugin.config.v1 is negotiated.
// One outstanding delivery per connection; reconnect always reapplies latest.
message PluginConfig {
  string version = 1;
  google.protobuf.Struct values = 2;
  string delivery_id = 3;
  uint32 apply_timeout_ms = 4;
  // CONTRACT_STATUS: not_implemented - target version distinct from delivery identity.
  uint64 config_version = 5;
  // CONTRACT_STATUS: not_implemented - target execution/connection binding.
  Fence fence = 6;
}
// Success means the callback completed, not merely that bytes were received.
// Failure requires a stable error; success forbids error. No raw exception text.
// CONTRACT_STATUS: not_implemented - target config/fence validation pending.
message PluginConfigAck {
  uint64 config_version = 5;
  Fence fence = 6;
  string version = 1;
  string delivery_id = 2;
  bool accepted = 3;
  Error error = 4;
}

// Host requests are authorized against the registered plugin instance. The
// namespace and task owner are derived from that identity, never from input.
message HostRequest {
  string request_id = 1;
  string trace_id = 2;
  google.protobuf.Timestamp deadline = 3;
  string idempotency_key = 4;
  oneof operation {
    ModelChatRequest model_chat = 10;
    StorageGetRequest storage_get = 11;
    StorageSetRequest storage_set = 12;
    StorageDeleteRequest storage_delete = 13;
    TaskCreateRequest task_create = 14;
    TaskCancelRequest task_cancel = 15;
    TaskGetRequest task_get = 16;
    // CONTRACT_STATUS: not_implemented - P09 target declaration, no producer.
    StorageCompareAndSetRequest storage_compare_and_set = 17;
  }
}

message HostResponse {
  string request_id = 1;
  // On failure error is present and result is unset. On success the matching
  // result is set and error is absent.
  Error error = 2;
  oneof result {
    ModelChatResponse model_chat = 10;
    StorageGetResponse storage_get = 11;
    StorageSetResponse storage_set = 12;
    StorageDeleteResponse storage_delete = 13;
    TaskResponse task_create = 14;
    TaskResponse task_cancel = 15;
    TaskResponse task_get = 16;
    // CONTRACT_STATUS: not_implemented - P09 target declaration, no producer.
    StorageCompareAndSetResponse storage_compare_and_set = 17;
  }
}

message ModelChatRequest {
  // Requires negotiated host.model.v1 and granted model.chat. Non-streaming;
  // no automatic retry or idempotent replay after timeout/disconnection.
  string model = 1;
  repeated ModelMessage messages = 2;
}
message ModelMessage { string role = 1; string text = 2; }
message ModelChatResponse {
  string text = 1;
  uint64 input_tokens = 2;
  uint64 output_tokens = 3;
}
// P09 target storage frames: namespace scope is resolved by Runtime from the authenticated
// instance; the plugin never supplies an owner. Shared-namespace Set/Delete/CAS require a
// StorageCondition (absent=create, version=update/delete); private Set must omit condition.
message StorageGetRequest {
  string key = 1;
  // CONTRACT_STATUS: not_implemented - P09 target declaration, no producer.
  // Absent scope means instance_private; installation_shared is resolved server-side.
  NamespaceScope scope = 2;
}
message StorageGetResponse {
  bytes value = 1;
  // CONTRACT_STATUS: not_implemented - P09 target declaration, no producer.
  uint64 version = 2;
  // CONTRACT_STATUS: not_implemented - P09 target declaration, no producer.
  google.protobuf.Timestamp expires_at = 3;
}
message StorageSetRequest {
  string key = 1;
  bytes value = 2;
  // Optional expiration; absent means no expiration.
  google.protobuf.Timestamp expires_at = 3;
  // CONTRACT_STATUS: not_implemented - P09 target declaration, no producer.
  NamespaceScope scope = 4;
  // CONTRACT_STATUS: not_implemented - P09 target declaration, no producer.
  // Private namespace: must be absent. Shared namespace: required (absent=create, version=update).
  StorageCondition condition = 5;
}
message StorageSetResponse {
  // CONTRACT_STATUS: not_implemented - P09 target declaration, no producer.
  uint64 version = 1;
  // CONTRACT_STATUS: not_implemented - P09 target declaration, no producer.
  google.protobuf.Timestamp expires_at = 2;
}
message StorageDeleteRequest {
  string key = 1;
  // CONTRACT_STATUS: not_implemented - P09 target declaration, no producer.
  NamespaceScope scope = 2;
  // CONTRACT_STATUS: not_implemented - P09 target declaration, no producer.
  // Private: optional (LWW delete). Shared: required current version.
  StorageCondition condition = 3;
}
message StorageDeleteResponse {
  // CONTRACT_STATUS: not_implemented - P09 target declaration, no producer.
  bool deleted = 1;
  // CONTRACT_STATUS: not_implemented - P09 target declaration, no producer.
  uint64 version = 2;
}
// CONTRACT_STATUS: not_implemented - P09 target declaration, no producer.
message StorageCompareAndSetRequest {
  string key = 1;
  NamespaceScope scope = 2;
  bytes value = 3;
  // Required in both private and shared namespaces (absent=create, version=update).
  StorageCondition condition = 4;
  google.protobuf.Timestamp expires_at = 5;
}
// CONTRACT_STATUS: not_implemented - P09 target declaration, no producer.
message StorageCompareAndSetResponse {
  StorageEntry entry = 1;
}

message TaskCreateRequest {
  // Requires host.tasks.v1, task.schedule and event.timer.triggered subscription.
  // task_id is the business identity; HostRequest.idempotency_key is the command idempotency.
  // Same task_id with different content is CONFLICT; same content returns the current state.
  // COMPLETED means the owner's TimerTriggered event is durably enqueued, not that a plugin
  // callback succeeded or was delivered/ACKed.
  string task_id = 1;
  string target_conversation = 2;
  bytes payload = 3;
  oneof when {
    google.protobuf.Timestamp run_at = 4;
    LocalTaskTime local_time = 5;
  }
}
message TaskCancelRequest { string task_id = 1; }
message TaskGetRequest { string task_id = 1; }
// LocalTaskTime/ScheduledTaskState live in common.proto (P10 relocation, FQN unchanged).
message TaskResponse {
  string task_id = 1;
  ScheduledTaskState state = 2;
  google.protobuf.Timestamp next_run_at = 3;
  // CONTRACT_STATUS: not_implemented - P10 target declaration, no producer.
  uint64 version = 4;
  // CONTRACT_STATUS: not_implemented - P10 target declaration, no producer.
  // Occurrence created for this task at claim time; empty while PENDING/none.
  string occurrence_id = 5;
}
