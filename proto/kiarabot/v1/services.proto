syntax = "proto3";

package kiarabot.v1;

import "kiarabot/v1/adapters.proto";
import "kiarabot/v1/plugins.proto";

// Unified target: TLS server validation and per-instance revocable bootstrap,
// then audience-bound short proof. Post-registration frames require current
// nonzero fence; no event-only/legacy admission. Unary failure uses the stable
// gRPC mapping and RpcFailure in status details. Stream business failures carry
// Error/typed receipt then close when terminal. Missing response remains unknown.
// CONTRACT_STATUS: not_implemented - target registration/leases not wired.
service AdapterBridge {
  rpc Connect(stream AdapterToCore) returns (stream CoreToAdapter);
}

service PluginBridge {
  rpc Connect(stream PluginToCore) returns (stream CoreToPlugin);
}
