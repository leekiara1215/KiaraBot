asyncapi: 2.6.0
id: https://github.com/leekiara1215/KiaraBot
info:
  title: KiaraBot Control WebSocket API
  version: 1.0.0
  description: Authenticated real-time channels used by the control panel.
  contact:
    name: KiaraBot maintainers
    url: https://github.com/leekiara1215/KiaraBot
    email: kiarabot@example.invalid
  license:
    name: MIT
    url: https://github.com/leekiara1215/KiaraBot/blob/main/LICENSE.md
tags:
  - name: control-plane
    description: Authenticated control-panel streaming channels.
defaultContentType: application/json
x-target-transport: implemented
x-target-transport-note: >-
  The target transport (WS-04 Beast/TLS session, handshake, replay, retention, close
  codes and limits) is implemented. The dedicated target channels health, logs,
  adapters, plugins, tasks, messages and operations have real target producers
  (owner queries or in-process readiness; see per-channel markers). /ws/control
  aggregation remains not_implemented and keeps its channel marker. Each target
  connection binds one owner and an exact authorized scope. Owner REST snapshots
  remain the authoritative recovery source; notifications never prove completion.
x-target-contract:
  status: implemented
  routes: >-
    /ws/operations requires owner_service=runtime|scheduler|model|host in the query.
    /ws/control requires owner_service=control|runtime|scheduler|identity; target
    control aggregates only event types belonging to that one owner and authorized
    scope. /ws/logs requires owner_service=identity|runtime. Dedicated health,
    adapters, plugins, tasks and messages bind control, runtime, runtime, scheduler
    and runtime respectively. No access token, stream session or cursor belongs in a URL.
  handshakes: >-
    Operations uses OperationHello/OperationResume. Other target channels use
    TargetScopedHello/TargetScopedResume, requiring scope; reference Hello/Resume
    remain historical variants. Health scope is exactly RESOURCE_CATALOG/control;
    logs uses that explicit catalog with log.read; exact-scope channels contain
    1..127 distinct exact resources, never catalog-derived child grants. Target
    adapters accepts exactly one RESOURCE_CATALOG deployment catalog for an
    immutable full-directory scan (owner pages are re-authorized online per page;
    the catalog is a selector, never a child grant) or exactly one
    RESOURCE_ADAPTER; plugins accepts exactly one RESOURCE_CATALOG or exactly one
    RESOURCE_INSTANCE; tasks uses RESOURCE_TASK|RESOURCE_INSTANCE, messages uses
    RESOURCE_ACCOUNT. Mixed catalog+exact selections are rejected. Canonicalize
    by kind/id and bind principal, Identity session, authorization version, channel,
    owner and canonical scope. A cursor is not an authorization capability.
  delivery_batches:
    first: [operation.updated, health.updated, adapter.updated, plugin.updated]
    second: [task.updated, log.updated]
    third: [message.updated]
    host_operation_dependency: Independent Host operation ownership and authorization.
  unavailable: >-
    Channel availability is tracked per channel: /ws/control aggregation and
    plugin.updated.health_state remain not_implemented; a supported route without an
    implemented producer fails closed with 1011 after authentication and never
    establishes a successful empty stream. Unknown routes remain HTTP NOT_FOUND.
  operation_changes: >-
    RuntimeService/SchedulerService/ModelService/HostManagementService.ListOperationChanges
    uses observations.proto. Missing cursor captures committed head with no changes;
    each returned change has its own owner cursor, and next_cursor is consumed only
    after the entire page. Default page size 32, maximum 100; unary deadline 500ms.
    Append operation and participant progress in the same owner UoW, using commit
    order rather than pre-commit nextval order. Keep a bounded 600-second journal
    and durable low-water mark. Dataset epoch survives ordinary owner restart and
    changes after restore, journal rebuild or sequence reset. No Control-owned DB
    or temporary operation-id collection can replace the owner journal.
  operation_permissions: {runtime: resource.read, model: resource.read, scheduler: task.read, host: host.read}
  operation_scope: >-
    Runtime exact resources follow RuntimeService.GetOperation scope kinds; Model
    requires RESOURCE_MODEL; Scheduler requires RESOURCE_TASK|RESOURCE_INSTANCE;
    Host accepts exactly its own RESOURCE_HOST. Permission checks occur online on
    every page and before emitting replay/live data. No new WS business permission.
  origin: >-
    Production uses WSS and an explicit same-origin allowlist. Browser Origin is
    checked before Upgrade; no wildcard origin. Non-browser missing-Origin policy
    must be explicitly configured. Never authenticate from cookies or query tokens.
  limits:
    first_frame_timeout_ms: 5000
    max_frame_bytes: 65536
    max_pending_frames: 128
    max_pending_bytes: 1048576
    replay_batch_size: 32
    max_replay_bytes_per_session: 4194304
    max_retained_bytes: 67108864
    frame_type: text
  quotas: >-
    Retained sessions and active socket/auth RPC quotas are separate. Admission must
    preserve bounded REST capacity and the one-second revocation deadline; reject
    excess sockets with 1013. Retained byte eviction advances an explicit replay
    boundary. Never silently discard a queued event or reuse another session's cursor.
  secrecy: >-
    No token, refresh token, proof, session_id, raw cursor, bootstrap, configuration,
    message/model body or arbitrary upstream error text in logs, metrics or event
    payloads. Operation reasons use stable codes and approved closed-set messages.
x-control-session-policy:
  authorization: Current roles and permissions follow openapi.yaml x-control-policy; control contains the union of allowed channels, never unfiltered data.
  permissions: {operations: owner-specific, health: health.read, logs: log.read, adapters: adapter.read, plugins: plugin.read, tasks: task.read, messages: message.read}
  health_aggregation: >-
    The health REST contract in openapi.yaml x-control-policy.health_aggregation is authoritative:
    four direct dependencies identity/runtime/scheduler/model; Identity/credential-chain/revocation
    failure is unready, while Runtime/Scheduler/Model single failure is DEGRADED for affected
    features only. The health.updated stream stays not_implemented until a real producer exists;
    clients use authorized GET /api/v1/health and never infer component states from this channel.
  logs_default: >-
    Target P12 v1 has no Control WebSocket server. Log/audit data is REST-only at /logs and
    /audit with distinct explicit log.read (48) / audit.read (49) grants; no default role derives
    either and neither implies the other. P12c-6 wires the REST aggregation over
    IdentityService/RuntimeService ListLogs|ListAudit: rows are merged by occurred_at+owner+id with
    the owner annotated, keyset tokens pass through to both owners, and if any authoritative owner
    source is unavailable Control returns 503 UNAVAILABLE, never a successful empty page. The logs
    channel below remains a deferred target frame contract (not_implemented), not a v1 transport
    claim.

  messages_default: >-
    No default role grants message.read, including admins. The messages channel
    requires an explicit per-user grant (`users[].permissions` in the private
    control configuration); there is no role or wildcard path to it. The channel
    is an event-only metadata feed: payloads carry message_id, conversation_id
    and direction, never message content, and v1 produces `received` only
    because `event.message.sent` stays not_implemented. Target uses current Identity
    exact-resource assignments instead of the reference private user configuration. There is no REST message
    projection: a message.updated notification is self-contained metadata, the
    stream keeps bounded ten-minute replay and is not an audit log, and clients
    must not reconstruct history after a restart or resync.
  sequences: Per authenticated stream session; SESSION_READY.last_sequence is the accepted replay boundary. Replay follows SESSION_READY before live events.
  snapshots: Establish stream before REST reads, buffer events during reads, then refresh affected resources. A lost stream during snapshot loading requires resume or a new hello and full refresh.
  retention_seconds: 600
  coalescing: Resource snapshots are compared every 100ms; changes to query-only observed_at/checked_at alone are not notifications. Meaningful state changes may coalesce intermediate states and are not an audit log. Every published notification is sequenced.
  capacity: At most 4096 retained events and 4MiB per stream, 1024 retained sessions and 64MiB total retained bytes. Eviction requires RESYNC_REQUIRED; replay is delivered in batches of at most 32 before live events.
  target_session_check: Every 250ms start or share current Identity validation; each call has 500ms budget. Close when last confirmation is older than 750ms; scheduling allowance must keep total under 1 second, otherwise not ready.
  revoke_expiry: Validate at handshake and before every event; close within one second after session revocation, permission loss or access expiry.
  close_codes: {invalid_first_frame: 4400, unauthenticated: 4401, forbidden: 4403, internal: 1011, slow_consumer: 1013, shutdown: 1001}
  resync: Send RESYNC_REQUIRED with CURSOR_EXPIRED, INVALID_CURSOR or SERVER_RESTART, then close 1000. Client discards the stream session.
  failure_mapping: >-
    Malformed first frame/scope/owner selector is 4400; session invalid/expired is
    4401; current authorization refusal or principal/channel/owner/scope binding
    mismatch is 4403. Identity cannot be confirmed within the freshness budget,
    owner TIMEOUT/UPSTREAM_UNAVAILABLE, malformed upstream or unimplemented source
    is 1011; no cached grant or successful empty stream. RATE_LIMITED or a slow
    consumer is 1013. Invalid local replay sequence/cursor binding sends
    INVALID_CURSOR; retained owner/Control cursor expiration or owner dataset epoch
    change sends CURSOR_EXPIRED; Control process epoch change sends SERVER_RESTART.
    Owner CONFLICT+NOT_ACCEPTED+RESYNC_SNAPSHOT maps conservatively to CURSOR_EXPIRED.
  client_recovery: >-
    SESSION_READY acknowledges the client's accepted processed sequence, never the
    server's undelivered head. OperationSessionReady also returns the owner cursor
    at that exact boundary, including before the first event. Token rotation in
    the same Identity session resumes with new token and retained cursor. Buffer
    dirty resources during REST snapshot reads and refresh afterward. WS failure
    does not deny independently authorized REST; show stale/last-confirmed state.
    4401 returns to login; 4400/4403/1013 stop automatic retries. Messages have no
    REST history: resync cannot reconstruct metadata missed outside replay.
x-contract-status:
  contract_version: kiarabot.v1
  status_registry: proto/tests/contract_status.json
  # Channel handles and stream event types that exist in the contract but are not usable in v1.
  not_implemented:
    - operations
    - operation.updated
    - health.updated
    - plugin.updated.health_state
  deprecated: []
servers:
  control:
    url: control.example.invalid/ws
    protocol: wss
    description: Production requires TLS; hello and resume authenticate with an access token in the first frame. Resume requires a session bound to the same identity and channel. Local development may use ws on loopback.
channels:
  control:
    x-target-contract-status: not_implemented
    x-target-handshake: [TargetControlHello, TargetControlResume]
    publish:
      operationId: receiveClientHandshake
      summary: Client authentication and resume handshake
      message:
        oneOf:
          - $ref: '#/components/messages/Hello'
          - $ref: '#/components/messages/TargetControlHello'
          - $ref: '#/components/messages/Resume'
          - $ref: '#/components/messages/TargetControlResume'
    subscribe:
      operationId: receiveControlEvent
      message:
        oneOf:
          - $ref: '#/components/messages/SessionReady'
          - $ref: '#/components/messages/ResyncRequired'
          - $ref: '#/components/messages/HealthUpdate'
          - $ref: '#/components/messages/LogUpdate'
          - $ref: '#/components/messages/AdapterUpdate'
          - $ref: '#/components/messages/TargetControlAdapterUpdate'
          - $ref: '#/components/messages/PluginUpdate'
          - $ref: '#/components/messages/TargetControlPluginUpdate'
          - $ref: '#/components/messages/TaskUpdate'
          - $ref: '#/components/messages/TargetControlTaskUpdate'
          - $ref: '#/components/messages/MessageUpdate'
  health:
    x-target-handshake: [TargetHealthHello, TargetHealthResume]
    publish:
      operationId: handshakeHealthChannel
      message:
        oneOf:
          - $ref: '#/components/messages/HealthHello'
          - $ref: '#/components/messages/TargetHealthHello'
          - $ref: '#/components/messages/HealthResume'
          - $ref: '#/components/messages/TargetHealthResume'
    subscribe:
      operationId: subscribeHealth
      message:
        oneOf:
          - $ref: '#/components/messages/HealthSession'
          - $ref: '#/components/messages/HealthResyncRequired'
          - $ref: '#/components/messages/HealthChannelUpdate'
  logs:
    x-target-handshake: [TargetLogHello, TargetLogResume]
    publish:
      operationId: handshakeLogChannel
      message:
        oneOf:
          - $ref: '#/components/messages/LogHello'
          - $ref: '#/components/messages/TargetLogHello'
          - $ref: '#/components/messages/LogResume'
          - $ref: '#/components/messages/TargetLogResume'
    subscribe:
      operationId: subscribeLogs
      message:
        oneOf:
          - $ref: '#/components/messages/LogSession'
          - $ref: '#/components/messages/LogResyncRequired'
          - $ref: '#/components/messages/LogChannelUpdate'
          - $ref: '#/components/messages/TargetLogUpdate'
  adapters:
    x-target-handshake: [TargetAdapterHello, TargetAdapterResume]
    publish:
      operationId: handshakeAdapterChannel
      message:
        oneOf:
          - $ref: '#/components/messages/AdapterHello'
          - $ref: '#/components/messages/TargetAdapterHello'
          - $ref: '#/components/messages/AdapterResume'
          - $ref: '#/components/messages/TargetAdapterResume'
    subscribe:
      operationId: subscribeAdapters
      message:
        oneOf:
          - $ref: '#/components/messages/AdapterSession'
          - $ref: '#/components/messages/AdapterResyncRequired'
          - $ref: '#/components/messages/AdapterChannelUpdate'
          - $ref: '#/components/messages/TargetAdapterUpdate'
  plugins:
    x-target-handshake: [TargetPluginHello, TargetPluginResume]
    publish:
      operationId: handshakePluginChannel
      message:
        oneOf:
          - $ref: '#/components/messages/PluginHello'
          - $ref: '#/components/messages/TargetPluginHello'
          - $ref: '#/components/messages/PluginResume'
          - $ref: '#/components/messages/TargetPluginResume'
    subscribe:
      operationId: subscribePlugins
      message:
        oneOf:
          - $ref: '#/components/messages/PluginSession'
          - $ref: '#/components/messages/PluginResyncRequired'
          - $ref: '#/components/messages/PluginChannelUpdate'
          - $ref: '#/components/messages/TargetPluginUpdate'
  tasks:
    x-target-handshake: [TargetTaskHello, TargetTaskResume]
    publish:
      operationId: handshakeTaskChannel
      message:
        oneOf:
          - $ref: '#/components/messages/TaskHello'
          - $ref: '#/components/messages/TargetTaskHello'
          - $ref: '#/components/messages/TaskResume'
          - $ref: '#/components/messages/TargetTaskResume'
    subscribe:
      operationId: subscribeTasks
      message:
        oneOf:
          - $ref: '#/components/messages/TaskSession'
          - $ref: '#/components/messages/TaskResyncRequired'
          - $ref: '#/components/messages/TaskChannelUpdate'
          - $ref: '#/components/messages/TargetTaskUpdate'
  messages:
    x-target-handshake: [TargetMessageHello, TargetMessageResume]
    description: >-
      Reference metadata-only notification feed; target remains not_implemented. The reference server emits
      message.updated for newly accepted platform messages when, and only when,
      the authenticated user holds an explicit message.read grant; no default
      role does. Payloads carry message_id, conversation_id and direction and
      never message content. v1 emits direction=received only, because
      event.message.sent stays not_implemented. There is no REST message
      projection: the notification is self-contained metadata, replay is bounded
      to ten minutes and is not an audit log, and a client must not reconstruct
      history after a restart or resync.
    publish:
      operationId: handshakeMessageChannel
      message:
        oneOf:
          - $ref: '#/components/messages/MessageHello'
          - $ref: '#/components/messages/TargetMessageHello'
          - $ref: '#/components/messages/MessageResume'
          - $ref: '#/components/messages/TargetMessageResume'
    subscribe:
      operationId: subscribeMessages
      message:
        oneOf:
          - $ref: '#/components/messages/MessageSession'
          - $ref: '#/components/messages/MessageResyncRequired'
          - $ref: '#/components/messages/MessageChannelUpdate'
          - $ref: '#/components/messages/TargetMessageUpdate'
  operations:
    x-contract-status: not_implemented
    description: Scoped single-owner operation progress; no production publisher yet. Current Identity session and owner-specific operation read permission are required. First frame authenticates and supplies scope. Resume is bound to the same principal and scope. SESSION_READY precedes replay/live events. Owner cursor gaps require RESYNC_REQUIRED and a fresh owner snapshot; no cross-owner atomic snapshot is implied.
    publish:
      operationId: handshakeOperations
      message:
        oneOf:
          - $ref: '#/components/messages/OperationHello'
          - $ref: '#/components/messages/OperationResume'
    subscribe:
      operationId: subscribeOperations
      message:
        oneOf:
          - $ref: '#/components/messages/OperationUpdate'
          - $ref: '#/components/messages/OperationReady'
          - $ref: '#/components/messages/OperationResync'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        First-frame authentication only (hello/resume access_token). It is not
        bound to a channel-level security requirement because AsyncAPI 2.x
        cannot express in-band WebSocket authentication.
  messages:
    OperationHello:
      messageId: operation-hello
      payload: { $ref: '#/components/schemas/OperationHello' }
    OperationResume:
      messageId: operation-resume
      payload: { $ref: '#/components/schemas/OperationResume' }
    OperationReady:
      messageId: operation-ready
      payload: { $ref: '#/components/schemas/OperationSessionReady' }
    OperationResync:
      messageId: operation-resync
      payload: { $ref: '#/components/schemas/ResyncRequired' }
    OperationUpdate:
      messageId: operation-update
      x-contract-status: not_implemented
      payload: { $ref: '#/components/schemas/OperationEnvelope' }
    SessionReady:
      name: SessionReady
      messageId: session-ready
      title: Session established or resumed
      payload: { $ref: '#/components/schemas/SessionReady' }
    Hello:
      name: Hello
      messageId: hello
      title: Initial authentication handshake
      payload: { $ref: '#/components/schemas/ReferenceHello' }
    Resume:
      name: Resume
      messageId: resume
      title: Resume a previous WebSocket session
      payload: { $ref: '#/components/schemas/ReferenceResume' }
    ResyncRequired:
      name: ResyncRequired
      messageId: resync-required
      title: Server requests a REST snapshot
      payload: { $ref: '#/components/schemas/ResyncRequired' }
    HealthUpdate:
      messageId: health-update
      x-contract-status: not_implemented
      description: Target not_implemented; the future producer reuses the authorized four-dependency REST health observation, never a fixed HEALTHY value.
      payload: { $ref: '#/components/schemas/HealthEnvelope' }
    LogUpdate:
      messageId: log-update
      payload: { $ref: '#/components/schemas/LogStreamEnvelope' }
    AdapterUpdate:
      messageId: adapter-update
      payload: { $ref: '#/components/schemas/AdapterEnvelope' }
    PluginUpdate:
      messageId: plugin-update
      payload: { $ref: '#/components/schemas/PluginEnvelope' }
    TaskUpdate:
      messageId: task-update
      payload: { $ref: '#/components/schemas/TaskEnvelope' }
    MessageUpdate:
      messageId: message-update
      description: Metadata-only message notification; no message content is ever pushed.
      payload: { $ref: '#/components/schemas/MessageEnvelope' }
    HealthChannelUpdate:
      messageId: health-channel-update
      x-contract-status: not_implemented
      description: Contract status not_implemented; see HealthUpdate.
      payload: { $ref: '#/components/schemas/HealthEnvelope' }
    LogChannelUpdate:
      messageId: log-channel-update
      payload: { $ref: '#/components/schemas/LogStreamEnvelope' }
    AdapterChannelUpdate:
      messageId: adapter-channel-update
      payload: { $ref: '#/components/schemas/AdapterEnvelope' }
    PluginChannelUpdate:
      messageId: plugin-channel-update
      payload: { $ref: '#/components/schemas/PluginEnvelope' }
    TaskChannelUpdate:
      messageId: task-channel-update
      payload: { $ref: '#/components/schemas/TaskEnvelope' }
    MessageChannelUpdate:
      messageId: message-channel-update
      payload: { $ref: '#/components/schemas/MessageEnvelope' }
    HealthHello:
      messageId: health-hello
      payload: { $ref: '#/components/schemas/ReferenceHello' }
    HealthResume:
      messageId: health-resume
      payload: { $ref: '#/components/schemas/ReferenceResume' }
    HealthSession:
