asyncapi: 2.6.0
id: https://github.com/leekiara1215/KiaraBot
info:
  title: KiaraBot Control WebSocket API
  version: 1.0.0
  description: Authenticated real-time channels used by the control panel.
  contact:
    name: KiaraBot maintainers
    url: https://github.com/leekiara1215/KiaraBot
    email: kiarabot@example.invalid
  license:
    name: MIT
    url: https://github.com/leekiara1215/KiaraBot/blob/main/LICENSE.md
tags:
  - name: control-plane
    description: Authenticated control-panel streaming channels.
defaultContentType: application/json
x-control-session-policy:
  authorization: Current roles and permissions follow openapi.yaml x-control-policy; control contains the union of allowed channels, never unfiltered data.
  permissions: {health: health.read, logs: log.read, adapters: adapter.read, plugins: plugin.read, tasks: task.read, messages: message.read}
  messages_default: >-
    No default role grants message.read, including admins. The messages channel
    requires an explicit per-user grant (`users[].permissions` in the private
    control configuration); there is no role or wildcard path to it. The channel
    is an event-only metadata feed: payloads carry message_id, conversation_id
    and direction, never message content, and v1 produces `received` only
    because `event.message.sent` stays not_implemented. There is no REST message
    projection: a message.updated notification is self-contained metadata, the
    stream keeps bounded ten-minute replay and is not an audit log, and clients
    must not reconstruct history after a restart or resync.
  sequences: Per authenticated stream session; SESSION_READY.last_sequence is the accepted replay boundary. Replay follows SESSION_READY before live events.
  snapshots: Establish stream before REST reads, buffer events during reads, then refresh affected resources. A lost stream during snapshot loading requires resume or a new hello and full refresh.
  retention_seconds: 600
  coalescing: Resource snapshots are compared every 100ms; notifications may coalesce intermediate states and are not an audit log. Every published notification is sequenced.
  capacity: At most 4096 retained events per stream and 1024 retained stream sessions. Gaps caused by eviction require RESYNC_REQUIRED; replay is delivered in bounded batches before live events.
  revoke_expiry: Validate at handshake and before every event; close within one second after session revocation, permission loss or access expiry.
  close_codes: {invalid_first_frame: 4400, unauthenticated: 4401, forbidden: 4403, internal: 1011, slow_consumer: 1013}
  resync: Send RESYNC_REQUIRED with CURSOR_EXPIRED, INVALID_CURSOR or SERVER_RESTART, then close 1000. Client discards the stream session.
x-contract-status:
  contract_version: kiarabot.v1
  status_registry: proto/tests/contract_status.json
  # Channel handles and stream event types that exist in the contract but are not usable in v1.
  not_implemented:
    - health.updated
    - plugin.updated.health_state
  deprecated: []
servers:
  control:
    url: control.example.invalid/ws
    protocol: wss
    description: Production requires TLS; hello and resume authenticate with an access token in the first frame. Resume requires a session bound to the same identity and channel. Local development may use ws on loopback.
channels:
  control:
    publish:
      operationId: receiveClientHandshake
      summary: Client authentication and resume handshake
      message:
        oneOf:
          - $ref: '#/components/messages/Hello'
          - $ref: '#/components/messages/Resume'
    subscribe:
      operationId: receiveControlEvent
      message:
        oneOf:
          - $ref: '#/components/messages/SessionReady'
          - $ref: '#/components/messages/ResyncRequired'
          - $ref: '#/components/messages/HealthUpdate'
          - $ref: '#/components/messages/LogUpdate'
          - $ref: '#/components/messages/AdapterUpdate'
          - $ref: '#/components/messages/PluginUpdate'
          - $ref: '#/components/messages/TaskUpdate'
          - $ref: '#/components/messages/MessageUpdate'
  health:
    publish:
      operationId: handshakeHealthChannel
      message:
        oneOf:
          - $ref: '#/components/messages/HealthHello'
          - $ref: '#/components/messages/HealthResume'
    subscribe:
      operationId: subscribeHealth
      message:
        oneOf:
          - $ref: '#/components/messages/HealthSession'
          - $ref: '#/components/messages/HealthResyncRequired'
          - $ref: '#/components/messages/HealthChannelUpdate'
  logs:
    publish:
      operationId: handshakeLogChannel
      message:
        oneOf:
          - $ref: '#/components/messages/LogHello'
          - $ref: '#/components/messages/LogResume'
    subscribe:
      operationId: subscribeLogs
      message:
        oneOf:
          - $ref: '#/components/messages/LogSession'
          - $ref: '#/components/messages/LogResyncRequired'
          - $ref: '#/components/messages/LogChannelUpdate'
  adapters:
    publish:
      operationId: handshakeAdapterChannel
      message:
        oneOf:
          - $ref: '#/components/messages/AdapterHello'
          - $ref: '#/components/messages/AdapterResume'
    subscribe:
      operationId: subscribeAdapters
      message:
        oneOf:
          - $ref: '#/components/messages/AdapterSession'
          - $ref: '#/components/messages/AdapterResyncRequired'
          - $ref: '#/components/messages/AdapterChannelUpdate'
  plugins:
    publish:
      operationId: handshakePluginChannel
      message:
        oneOf:
          - $ref: '#/components/messages/PluginHello'
          - $ref: '#/components/messages/PluginResume'
    subscribe:
      operationId: subscribePlugins
      message:
        oneOf:
          - $ref: '#/components/messages/PluginSession'
          - $ref: '#/components/messages/PluginResyncRequired'
          - $ref: '#/components/messages/PluginChannelUpdate'
  tasks:
    publish:
      operationId: handshakeTaskChannel
      message:
        oneOf:
          - $ref: '#/components/messages/TaskHello'
          - $ref: '#/components/messages/TaskResume'
    subscribe:
      operationId: subscribeTasks
      message:
        oneOf:
          - $ref: '#/components/messages/TaskSession'
          - $ref: '#/components/messages/TaskResyncRequired'
          - $ref: '#/components/messages/TaskChannelUpdate'
  messages:
    description: >-
      Implemented metadata-only notification feed. The server emits
      message.updated for newly accepted platform messages when, and only when,
      the authenticated user holds an explicit message.read grant; no default
      role does. Payloads carry message_id, conversation_id and direction and
      never message content. v1 emits direction=received only, because
      event.message.sent stays not_implemented. There is no REST message
      projection: the notification is self-contained metadata, replay is bounded
      to ten minutes and is not an audit log, and a client must not reconstruct
      history after a restart or resync.
    publish:
      operationId: handshakeMessageChannel
      message:
        oneOf:
          - $ref: '#/components/messages/MessageHello'
          - $ref: '#/components/messages/MessageResume'
    subscribe:
      operationId: subscribeMessages
      message:
        oneOf:
          - $ref: '#/components/messages/MessageSession'
          - $ref: '#/components/messages/MessageResyncRequired'
          - $ref: '#/components/messages/MessageChannelUpdate'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        First-frame authentication only (hello/resume access_token). It is not
        bound to a channel-level security requirement because AsyncAPI 2.x
        cannot express in-band WebSocket authentication.
  messages:
    SessionReady:
      name: SessionReady
      messageId: session-ready
      title: Session established or resumed
      payload: { $ref: '#/components/schemas/SessionReady' }
    Hello:
      name: Hello
      messageId: hello
      title: Initial authentication handshake
      payload: { $ref: '#/components/schemas/Hello' }
    Resume:
      name: Resume
      messageId: resume
      title: Resume a previous WebSocket session
      payload: { $ref: '#/components/schemas/Resume' }
    ResyncRequired:
      name: ResyncRequired
      messageId: resync-required
      title: Server requests a REST snapshot
      payload: { $ref: '#/components/schemas/ResyncRequired' }
    HealthUpdate:
      messageId: health-update
      x-contract-status: not_implemented
      description: Contract status not_implemented; the v1 health projection is a fixed HEALTHY snapshot, so health.updated is never produced.
      payload: { $ref: '#/components/schemas/HealthEnvelope' }
    LogUpdate:
      messageId: log-update
      payload: { $ref: '#/components/schemas/LogStreamEnvelope' }
    AdapterUpdate:
      messageId: adapter-update
      payload: { $ref: '#/components/schemas/AdapterEnvelope' }
    PluginUpdate:
      messageId: plugin-update
      payload: { $ref: '#/components/schemas/PluginEnvelope' }
    TaskUpdate:
      messageId: task-update
      payload: { $ref: '#/components/schemas/TaskEnvelope' }
    MessageUpdate:
      messageId: message-update
      description: Metadata-only message notification; no message content is ever pushed.
      payload: { $ref: '#/components/schemas/MessageEnvelope' }
    HealthChannelUpdate:
      messageId: health-channel-update
      x-contract-status: not_implemented
      description: Contract status not_implemented; see HealthUpdate.
      payload: { $ref: '#/components/schemas/HealthEnvelope' }
    LogChannelUpdate:
      messageId: log-channel-update
      payload: { $ref: '#/components/schemas/LogStreamEnvelope' }
    AdapterChannelUpdate:
      messageId: adapter-channel-update
      payload: { $ref: '#/components/schemas/AdapterEnvelope' }
    PluginChannelUpdate:
      messageId: plugin-channel-update
      payload: { $ref: '#/components/schemas/PluginEnvelope' }
    TaskChannelUpdate:
      messageId: task-channel-update
      payload: { $ref: '#/components/schemas/TaskEnvelope' }
    MessageChannelUpdate:
      messageId: message-channel-update
      payload: { $ref: '#/components/schemas/MessageEnvelope' }
    HealthHello:
      messageId: health-hello
      payload: { $ref: '#/components/schemas/Hello' }
    HealthResume:
      messageId: health-resume
      payload: { $ref: '#/components/schemas/Resume' }
    HealthSession:
      messageId: health-session
      payload: { $ref: '#/components/schemas/SessionReady' }
    HealthResyncRequired:
      messageId: health-resync-required
      payload: { $ref: '#/components/schemas/ResyncRequired' }
    LogHello:
      messageId: logs-hello
      payload: { $ref: '#/components/schemas/Hello' }
    LogResume:
      messageId: logs-resume
      payload: { $ref: '#/components/schemas/Resume' }
    LogSession:
      messageId: logs-session
      payload: { $ref: '#/components/schemas/SessionReady' }
    LogResyncRequired:
      messageId: logs-resync-required
      payload: { $ref: '#/components/schemas/ResyncRequired' }
    AdapterHello:
      messageId: adapters-hello
      payload: { $ref: '#/components/schemas/Hello' }
    AdapterResume:
      messageId: adapters-resume
      payload: { $ref: '#/components/schemas/Resume' }
    AdapterSession:
      messageId: adapters-session
      payload: { $ref: '#/components/schemas/SessionReady' }
    AdapterResyncRequired:
      messageId: adapters-resync-required
      payload: { $ref: '#/components/schemas/ResyncRequired' }
    PluginHello:
      messageId: plugins-hello
      payload: { $ref: '#/components/schemas/Hello' }
    PluginResume:
      messageId: plugins-resume
      payload: { $ref: '#/components/schemas/Resume' }
    PluginSession:
      messageId: plugins-session
      payload: { $ref: '#/components/schemas/SessionReady' }
    PluginResyncRequired:
      messageId: plugins-resync-required
      payload: { $ref: '#/components/schemas/ResyncRequired' }
    TaskHello:
      messageId: tasks-hello
      payload: { $ref: '#/components/schemas/Hello' }
    TaskResume:
      messageId: tasks-resume
      payload: { $ref: '#/components/schemas/Resume' }
    TaskSession:
      messageId: tasks-session
      payload: { $ref: '#/components/schemas/SessionReady' }
    TaskResyncRequired:
      messageId: tasks-resync-required
      payload: { $ref: '#/components/schemas/ResyncRequired' }
    MessageHello:
      messageId: messages-hello
      payload: { $ref: '#/components/schemas/Hello' }
    MessageResume:
      messageId: messages-resume
      payload: { $ref: '#/components/schemas/Resume' }
    MessageSession:
      messageId: messages-session
      payload: { $ref: '#/components/schemas/SessionReady' }
    MessageResyncRequired:
      messageId: messages-resync-required
      payload: { $ref: '#/components/schemas/ResyncRequired' }
  schemas:
    SessionReady:
      type: object
      required: [type, session_id, last_sequence]
      properties:
        type: { type: string, enum: [SESSION_READY] }
        session_id: { type: string, minLength: 32, description: Opaque secret session capability bound to the authenticated principal }
        last_sequence: { type: integer, format: int64, minimum: 0 }
    StreamEnvelope:
      type: object
      description: Sequence increases within one authorized session; replay retains events for 10 minutes. Different sessions do not share a sequence space. All times use UTC.
      required: [schema_version, event_type, sequence, occurred_at, payload]
      properties:
        schema_version: { type: string, example: kiarabot.stream.v1 }
        event_type: { type: string }
        sequence: { type: integer, format: int64, minimum: 0, description: Monotonic within the authenticated stream session. }
        occurred_at: { type: string, format: date-time }
        payload: { type: object, additionalProperties: true }
    LogStreamEnvelope:
      allOf:
        - $ref: '#/components/schemas/StreamEnvelope'
        - type: object
          required: [event_type, payload]
          properties:
            event_type: { type: string, enum: [log.updated] }
            payload: { $ref: './openapi.yaml#/components/schemas/LogEntry' }
    Hello:
      type: object
      description: First frame for a new session; access_token authenticates the principal. Use last_sequence 0 for a new session.
      required: [type, access_token, last_sequence]
      properties:
        type: { type: string, enum: [hello] }
        access_token: { type: string, minLength: 20 }
        last_sequence: { type: integer, format: int64, enum: [0] }
    Resume:
      type: object
      description: First frame for an existing session; access_token reauthenticates the same principal and last_sequence is the last event received by the client.
      required: [type, access_token, session_id, last_sequence]
      properties:
        type: { type: string, enum: [resume] }
        access_token: { type: string, minLength: 20 }
        session_id: { type: string, minLength: 32, description: Opaque secret session capability returned by SESSION_READY }
        last_sequence: { type: integer, format: int64, minimum: 0 }
    ResyncRequired:
      type: object
      description: Replay is unavailable or the cursor is invalid; obtain a fresh REST snapshot and start a new session.
      required: [type, reason]
      properties:
        type: { type: string, enum: [RESYNC_REQUIRED] }
        reason: { type: string }
    ErrorCode:
      type: string
      enum: [ERROR_CODE_UNSPECIFIED, INVALID_ARGUMENT, UNAUTHENTICATED, PERMISSION_DENIED, NOT_FOUND, CONFLICT, CAPABILITY_NOT_SUPPORTED, RATE_LIMITED, TIMEOUT, UPSTREAM_UNAVAILABLE, PLUGIN_UNAVAILABLE, INTERNAL]
    Error:
      type: object
      required: [code, message, request_id]
      properties:
        code: { $ref: '#/components/schemas/ErrorCode' }
        message: { type: string }
        request_id: { type: string }
        trace_id: { type: string }
        retryable: { type: boolean, default: false }
        details: { type: object, additionalProperties: { type: string } }
    HealthState:
      type: string
      enum: [HEALTH_STATE_UNSPECIFIED, HEALTHY, DEGRADED, UNHEALTHY]
    PluginState:
      type: string
      enum: [PLUGIN_STATE_UNSPECIFIED, PLUGIN_STATE_DISABLED, PLUGIN_STATE_STARTING, PLUGIN_STATE_READY, PLUGIN_STATE_RUNNING, PLUGIN_STATE_STOPPING, PLUGIN_STATE_STOPPED, PLUGIN_STATE_UNAVAILABLE, PLUGIN_STATE_FAILED]
    ActionStatus:
      type: string
      enum: [ACTION_STATUS_UNSPECIFIED, ACCEPTED, SUCCEEDED, FAILED, EXPIRED, CANCELLED]

    HealthComponent:
      type: object
      required: [component, state]
      properties:
        component: { type: string }
        state: { $ref: '#/components/schemas/HealthState' }
        reason: { type: string }
    HealthPayload:
      type: object
      required: [state, components]
      properties:
        state: { $ref: '#/components/schemas/HealthState' }
        components: { type: array, items: { $ref: '#/components/schemas/HealthComponent' } }
    LogPayload:
      type: object
      description: Redacted structured log; secrets and message bodies are excluded.
      required: [id, occurred_at, level, component, operation, outcome]
      properties:
        id: { type: string }
        occurred_at: { type: string, format: date-time }
        level: { type: string }
        component: { type: string }
        operation: { type: string }
        outcome: { type: string }
        trace_id: { type: string }
    AdapterPayload:
      type: object
      required: [id, state, implementation]
      properties:
        id: { type: string }
        state: { $ref: '#/components/schemas/HealthState' }
        implementation: { type: string }
        version: { type: string }
        capabilities: { type: array, items: { type: string } }
    PluginPayload:
      type: object
      required: [id, version]
      anyOf:
        - required: [state]
        - required: [health_state]
      properties:
        id: { type: string }
        version: { type: string }
        state: { $ref: '#/components/schemas/PluginState' }
        health_state:
          $ref: '#/components/schemas/HealthState'
          description: Contract status not_implemented; v1 plugin.updated emits only state, never health_state.
        reason: { type: string }
    TaskPayload:
      type: object
      required: [id, name, state]
      properties:
        id: { type: string }
        name: { type: string }
        state: { type: string }
    MessagePayload:
      type: object
      description: >-
        Metadata only; message content is never pushed by default and never in
        v1. direction is `received` in v1; `sent` is reserved because
        event.message.sent is not_implemented. action_id is only meaningful for
        sent messages and is therefore absent in v1.
      required: [message_id, conversation_id, direction]
      properties:
        message_id: { type: string }
        conversation_id: { type: string }
        direction: { type: string, enum: [received, sent] }
        action_id: { type: string }
      additionalProperties: false
    HealthEnvelope:
      allOf:
        - $ref: '#/components/schemas/StreamEnvelope'
        - type: object
          properties:
            event_type: { type: string, enum: [health.updated] }
            payload: { $ref: '#/components/schemas/HealthPayload' }
    LogEnvelope:
      allOf:
        - $ref: '#/components/schemas/StreamEnvelope'
        - type: object
          properties:
            event_type: { type: string, enum: [log.updated] }
            payload: { $ref: '#/components/schemas/LogPayload' }
    AdapterEnvelope:
      allOf:
        - $ref: '#/components/schemas/StreamEnvelope'
        - type: object
          properties:
            event_type: { type: string, enum: [adapter.updated] }
            payload: { $ref: '#/components/schemas/AdapterPayload' }
    PluginEnvelope:
      allOf:
        - $ref: '#/components/schemas/StreamEnvelope'
        - type: object
          properties:
            event_type: { type: string, enum: [plugin.updated] }
            payload: { $ref: '#/components/schemas/PluginPayload' }
    TaskEnvelope:
      allOf:
        - $ref: '#/components/schemas/StreamEnvelope'
        - type: object
          properties:
            event_type: { type: string, enum: [task.updated] }
            payload: { $ref: '#/components/schemas/TaskPayload' }
    MessageEnvelope:
      allOf:
        - $ref: '#/components/schemas/StreamEnvelope'
        - type: object
          properties:
            event_type: { type: string, enum: [message.updated] }
            payload: { $ref: '#/components/schemas/MessagePayload' }
