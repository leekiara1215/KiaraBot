  schemas:
    SessionReady:
      type: object
      required: [type, session_id, last_sequence]
      properties:
        type: { type: string, enum: [SESSION_READY] }
        session_id: { type: string, minLength: 32, maxLength: 256, description: Opaque secret session capability bound to the authenticated principal }
        last_sequence: { type: integer, format: int64, minimum: 0, maximum: 9007199254740991 }
    StreamEnvelope:
      type: object
      description: Sequence increases within one authorized session; replay retains events for 10 minutes. Different sessions do not share a sequence space. All times use UTC.
      required: [schema_version, event_type, sequence, occurred_at, payload]
      properties:
        schema_version: { type: string, example: kiarabot.stream.v1 }
        event_type: { type: string }
        sequence: { type: integer, format: int64, minimum: 0, maximum: 9007199254740991, description: Monotonic within the authenticated stream session. }
        occurred_at: { type: string, format: date-time }
        payload: { type: object, additionalProperties: true }
    LogStreamEnvelope:
      allOf:
        - $ref: '#/components/schemas/StreamEnvelope'
        - type: object
          required: [event_type, payload]
          properties:
            event_type: { type: string, enum: [log.updated] }
            payload: { $ref: './openapi.yaml#/components/schemas/LogEntry' }
    Hello:
      type: object
      description: First frame for a new session; access_token authenticates the principal. Use last_sequence 0 for a new session.
      required: [type, access_token, last_sequence]
      properties:
        type: { type: string, enum: [hello] }
        access_token: { type: string, minLength: 20, maxLength: 4096 }
        last_sequence: { type: integer, format: int64, enum: [0] }
    Resume:
      type: object
      description: First frame for an existing session; access_token reauthenticates the same principal and last_sequence is the last event received by the client.
      required: [type, access_token, session_id, last_sequence]
      properties:
        type: { type: string, enum: [resume] }
        access_token: { type: string, minLength: 20, maxLength: 4096 }
        session_id: { type: string, minLength: 32, maxLength: 256, description: Opaque secret session capability returned by SESSION_READY }
        last_sequence: { type: integer, format: int64, minimum: 0, maximum: 9007199254740991 }
    ResyncRequired:
      type: object
      description: Replay is unavailable or the cursor is invalid; obtain a fresh REST snapshot and start a new session.
      required: [type, reason]
      properties:
        type: { type: string, enum: [RESYNC_REQUIRED] }
        reason: { type: string, enum: [CURSOR_EXPIRED, INVALID_CURSOR, SERVER_RESTART] }
    ErrorCode:
      type: string
      enum: [ERROR_CODE_UNSPECIFIED, INVALID_ARGUMENT, UNAUTHENTICATED, PERMISSION_DENIED, NOT_FOUND, CONFLICT, CAPABILITY_NOT_SUPPORTED, RATE_LIMITED, TIMEOUT, UPSTREAM_UNAVAILABLE, PLUGIN_UNAVAILABLE, INTERNAL]
    Error:
      type: object
      required: [code, message, request_id]
      properties:
        code: { $ref: '#/components/schemas/ErrorCode' }
        message: { type: string }
        request_id: { type: string }
        trace_id: { type: string }
        retryable: { type: boolean, default: false }
        details: { type: object, additionalProperties: { type: string } }
    HealthState:
      type: string
      enum: [HEALTH_STATE_UNSPECIFIED, HEALTHY, DEGRADED, UNHEALTHY]
    PluginState:
      type: string
      enum: [PLUGIN_STATE_UNSPECIFIED, PLUGIN_STATE_DISABLED, PLUGIN_STATE_STARTING, PLUGIN_STATE_READY, PLUGIN_STATE_RUNNING, PLUGIN_STATE_STOPPING, PLUGIN_STATE_STOPPED, PLUGIN_STATE_UNAVAILABLE, PLUGIN_STATE_FAILED]
    ActionStatus:
      type: string
      enum: [ACTION_STATUS_UNSPECIFIED, ACCEPTED, SUCCEEDED, FAILED, EXPIRED, CANCELLED]

    HealthComponent:
      type: object
      required: [component, state]
      properties:
        component: { type: string }
        state: { $ref: '#/components/schemas/HealthState' }
        reason: { type: string }
    HealthPayload:
      type: object
      required: [state, components]
      properties:
        state: { $ref: '#/components/schemas/HealthState' }
        components: { type: array, items: { $ref: '#/components/schemas/HealthComponent' } }
    TargetLogPayload:
      type: object
      description: >-
        v1.2 target owner log metadata projection (ListLogChanges). Owner-issued redacted fact
        only: no audit payload, free-form message, actor secret or request body. additionalProperties
        is closed; request_id/trace_id are correlation identifiers only.
      additionalProperties: false
      required: [id, occurred_at, level, component, operation, outcome]
      properties:
        id: { type: string, minLength: 1 }
        occurred_at: { type: string, format: date-time }
        level: { type: string, enum: [DEBUG, INFO, WARN, ERROR] }
        component: { type: string, minLength: 1 }
        operation: { type: string, minLength: 1 }
        outcome: { type: string, enum: [request.recorded, request.rejected] }
        request_id: { type: string }
        trace_id: { type: string }
    TargetLogEnvelope:
      allOf:
        - $ref: '#/components/schemas/StreamEnvelope'
        - type: object
          required: [event_type, payload]
          properties:
            event_type: { type: string, enum: [log.updated] }
            payload: { $ref: '#/components/schemas/TargetLogPayload' }
    TargetMessagePayload:
      type: object
      description: >-
        v1.2 received-message metadata (ListMessageMetadataChanges). Self-contained metadata only;
        no message body, platform raw payload, platform id, action id or sent inference.
      additionalProperties: false
      required: [message_id, conversation_id, direction, received_at]
      properties:
        message_id: { type: string, minLength: 1 }
        conversation_id: { type: string, minLength: 1 }
        direction: { type: string, enum: [received] }
        received_at: { type: string, format: date-time }
    TargetMessageEnvelope:
      allOf:
        - $ref: '#/components/schemas/StreamEnvelope'
        - type: object
          required: [event_type, payload]
          properties:
            event_type: { type: string, enum: [message.updated] }
            payload: { $ref: '#/components/schemas/TargetMessagePayload' }
    LogPayload:
      type: object
      description: Redacted structured log; secrets and message bodies are excluded.
      required: [id, occurred_at, level, component, operation, outcome]
      properties:
        id: { type: string }
        occurred_at: { type: string, format: date-time }
        level: { type: string }
        component: { type: string }
        operation: { type: string }
        outcome: { type: string }
        trace_id: { type: string }
    AdapterPayload:
      type: object
      required: [id, state, implementation]
      properties:
        id: { type: string }
        state: { $ref: '#/components/schemas/HealthState' }
        implementation: { type: string }
        version: { type: string }
        capabilities: { type: array, items: { type: string } }
    PluginPayload:
      type: object
      required: [id, version]
      anyOf:
        - required: [state]
        - required: [health_state]
      properties:
        id: { type: string }
        version: { type: string }
        state: { $ref: '#/components/schemas/PluginState' }
        health_state:
          $ref: '#/components/schemas/HealthState'
          description: Contract status not_implemented; v1 plugin.updated emits only state, never health_state.
        reason: { type: string }
    TaskPayload:
      type: object
      required: [id, name, state]
      properties:
        id: { type: string }
        name: { type: string }
        state: { type: string }
    MessagePayload:
      type: object
      description: >-
        Metadata only; message content is never pushed by default and never in
        v1. direction is `received` in v1; `sent` is reserved because
        event.message.sent is not_implemented. action_id is only meaningful for
        sent messages and is therefore absent in v1.
      required: [message_id, conversation_id, direction]
      properties:
        message_id: { type: string }
        conversation_id: { type: string }
        direction: { type: string, enum: [received, sent] }
        action_id: { type: string }
      additionalProperties: false
    HealthEnvelope:
      allOf:
        - $ref: '#/components/schemas/StreamEnvelope'
        - type: object
          properties:
            event_type: { type: string, enum: [health.updated] }
            payload: { $ref: '#/components/schemas/HealthPayload' }
    LogEnvelope:
      allOf:
        - $ref: '#/components/schemas/StreamEnvelope'
        - type: object
          properties:
            event_type: { type: string, enum: [log.updated] }
            payload: { $ref: '#/components/schemas/LogPayload' }
    AdapterEnvelope:
      allOf:
        - $ref: '#/components/schemas/StreamEnvelope'
        - type: object
          properties:
            event_type: { type: string, enum: [adapter.updated] }
            payload: { $ref: '#/components/schemas/AdapterPayload' }
    PluginEnvelope:
      allOf:
        - $ref: '#/components/schemas/StreamEnvelope'
        - type: object
          properties:
            event_type: { type: string, enum: [plugin.updated] }
            payload: { $ref: '#/components/schemas/PluginPayload' }
    TaskEnvelope:
      allOf:
        - $ref: '#/components/schemas/StreamEnvelope'
        - type: object
          properties:
            event_type: { type: string, enum: [task.updated] }
            payload: { $ref: '#/components/schemas/TaskPayload' }
    MessageEnvelope:
      allOf:
        - $ref: '#/components/schemas/StreamEnvelope'
        - type: object
          properties:
            event_type: { type: string, enum: [message.updated] }
            payload: { $ref: '#/components/schemas/MessagePayload' }

    OperationHello:
      allOf:
        - $ref: '#/components/schemas/Hello'
        - type: object
          required: [scope]
          properties:
            scope: { $ref: '#/components/schemas/TargetOperationScope' }
    OperationResume:
      allOf:
        - $ref: '#/components/schemas/Resume'
        - type: object
          required: [scope, owner_cursor]
          properties:
            scope: { $ref: '#/components/schemas/TargetOperationScope' }
            owner_cursor: { $ref: '#/components/schemas/TargetOwnerCursor' }
    OperationEnvelope:
      allOf:
        - $ref: '#/components/schemas/StreamEnvelope'
        - type: object
          required: [event_type, payload, owner_cursor]
          properties:
            event_type: { type: string, enum: [operation.updated] }
            payload:
              allOf:
                - $ref: './openapi.yaml#/components/schemas/TargetOperation'
                - type: object
                  properties:
                    ref:
                      type: object
                      required: [resource]
                  description: Every change is bound to its real operation resource, never a caller-supplied guess.
            owner_cursor: { $ref: '#/components/schemas/TargetOwnerCursor' }

    TargetExactScope:
      allOf:
        - $ref: './openapi.yaml#/components/schemas/TargetResourceScope'
        - type: object
          properties:
            resources: { type: array, minItems: 1, maxItems: 127, uniqueItems: true }
      description: Exact authorized resources, canonicalized by kind/id; catalog is allowed only for explicit health/log control scope, never as a child grant.
    TargetScopedHello:
      allOf:
        - $ref: '#/components/schemas/Hello'
        - type: object
          required: [scope]
          properties:
            scope: { $ref: '#/components/schemas/TargetExactScope' }
    TargetScopedResume:
      allOf:
        - $ref: '#/components/schemas/Resume'
        - type: object
          required: [scope]
          properties:
            scope: { $ref: '#/components/schemas/TargetExactScope' }
    OperationSessionReady:
      allOf:
        - $ref: '#/components/schemas/SessionReady'
        - type: object
          required: [owner_cursor]
          properties:
            owner_cursor: { $ref: '#/components/schemas/TargetOwnerCursor' }
      description: Owner cursor at the accepted processed stream sequence, including the initial head before the first event; never an undelivered server head.
    TargetAdapterPayload:
      type: object
      additionalProperties: false
      required: [id, version, target]
      properties:
        id: { type: string, description: Exact adapter resource ID, equal to target.resource.id. }
        version: { $ref: './openapi.yaml#/components/schemas/TargetPositiveUint64' }
        target: { $ref: './openapi.yaml#/components/schemas/TargetAdapterRecord' }
      description: Target owner adapter projection; online/lifecycle/registration facts are not a fabricated legacy HEALTHY state. version equals target.version.
    TargetPluginPayload:
      type: object
      additionalProperties: false
      required: [id, version, target]
      properties:
        id: { type: string, description: Exact instance ID, equal to target.instance_id. }
        version: { $ref: './openapi.yaml#/components/schemas/TargetPositiveUint64' }
        target: { $ref: './openapi.yaml#/components/schemas/TargetInstanceRecord' }
      description: Target instance facts; version equals target.state.version. Runtime desired state, Host process_outcome and Plugin applied configuration remain distinct. Never includes configuration or bootstrap secrets; no inferred PluginState/health_state.
    TargetTaskPayload:
      type: object
      additionalProperties: false
      required: [id, version, target]
      properties:
        id: { type: string }
        version: { $ref: './openapi.yaml#/components/schemas/TargetPositiveUint64' }
        target:
          type: object
          additionalProperties: false
          required: [owner_instance_id, state, updated_at, cancel_requested]
          properties:
            owner_instance_id: { type: string }
            state: { type: string, enum: [SCHEDULED_TASK_PENDING, SCHEDULED_TASK_RUNNING, SCHEDULED_TASK_RETRYING, SCHEDULED_TASK_COMPLETED, SCHEDULED_TASK_FAILED, SCHEDULED_TASK_CANCELLED] }
            updated_at: { type: string, format: date-time }
            cancel_requested: { type: boolean }
            occurrence_id: { type: string }
            reason_code: { $ref: '#/components/schemas/ErrorCode' }
      description: Metadata-only Scheduler task state; no task payload, message body or arbitrary reason text. SCHEDULED_TASK_COMPLETED means durable trigger handoff, not plugin callback success.
    TargetAdapterEnvelope:
      allOf:
        - $ref: '#/components/schemas/StreamEnvelope'
        - type: object
          required: [event_type, payload]
          properties:
            event_type: { type: string, enum: [adapter.updated] }
            payload: { $ref: '#/components/schemas/TargetAdapterPayload' }
    TargetPluginEnvelope:
      allOf:
        - $ref: '#/components/schemas/StreamEnvelope'
        - type: object
          required: [event_type, payload]
          properties:
            event_type: { type: string, enum: [plugin.updated] }
            payload: { $ref: '#/components/schemas/TargetPluginPayload' }
    TargetTaskEnvelope:
      allOf:
        - $ref: '#/components/schemas/StreamEnvelope'
        - type: object
          required: [event_type, payload]
          properties:
            event_type: { type: string, enum: [task.updated] }
            payload: { $ref: '#/components/schemas/TargetTaskPayload' }

    ReferenceHello:
      allOf:
        - $ref: '#/components/schemas/Hello'
        - not: { required: [scope] }
      description: Historical reference variant; a scope selects the distinct target handshake variant.
    ReferenceResume:
      allOf:
        - $ref: '#/components/schemas/Resume'
        - not: { required: [scope] }
      description: Historical reference variant; target resumption must carry scope.

    TargetOperationScope:
      allOf:
        - $ref: '#/components/schemas/TargetExactScope'
        - type: object
          properties:
            resources:
              type: array
              items:
                type: object
                properties:
                  kind: { type: string, enum: [RESOURCE_ACCOUNT, RESOURCE_ADAPTER, RESOURCE_INSTALLATION, RESOURCE_INSTANCE, RESOURCE_HOST, RESOURCE_TASK, RESOURCE_MODEL] }
      description: Operation resource kinds only; the selected owner method further restricts kinds and current exact authorization. No catalog or inferred child scope.
    TargetOwnerCursor:
      allOf:
        - $ref: './openapi.yaml#/components/schemas/TargetStreamCursor'
        - type: object
          properties:
            source_service: { type: string, enum: [runtime, scheduler, model, host] }
            scope: { $ref: '#/components/schemas/TargetOperationScope' }
      description: One owner/dataset/scope boundary; not a cross-owner cursor or an authorization capability. Must equal the session's accepted processed boundary.
