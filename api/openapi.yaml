openapi: 3.0.3
info:
  title: KiaraBot Control API
  version: 1.0.0
  description: Versioned control-plane contract for the language-independent Core.
  license:
    name: MIT
    url: https://github.com/leekiara1215/KiaraBot/blob/main/LICENSE.md
servers:
  - url: /api/v1
security:
  - bearerAuth: []
x-control-policy:
  application_port: in-process-cpp-v1
  default_authorization: deny
  roles:
    admin: ['*']
    operator: [session.read, session.revoke, health.read, adapter.read, plugin.read, plugin.manage, plugin.config.read, plugin.config.write, bot.read, model.read, group.read, task.read, action.read, log.read]
    viewer: [session.read, session.revoke, health.read, adapter.read, plugin.read, bot.read, model.read, group.read, task.read, action.read]
  session_scope: Admin may query/revoke all sessions; other roles may query/revoke only their own. Cross-owner targets return NOT_FOUND.
  access_seconds: 900
  refresh_seconds: 2592000
  revocation: Each REST request verifies the current session. WebSockets close within one second of revocation or access expiry.
  idempotency:
    retention_seconds: 86400
    scope: Authenticated user ID + operationId + resource ID + key. Login uses normalized username; refresh uses the original session ID.
    fingerprint: Canonical typed request including all payload fields, excluding request_id/trace_id/deadline. Credentials are keyed digests, never plaintext fingerprints.
    commit: Successful effect, response receipt and audit commit atomically. Failures are not cached. Same key/different payload is CONFLICT.
    credentials: Token responses are encrypted at rest. Replay only while the session is active and the returned token generation is current; otherwise UNAUTHENTICATED.
    refresh: Same key/request replays the original current pair; a different key using the consumed refresh token is UNAUTHENTICATED.
    timeout: An unknown write result may be retried with the same key; TIMEOUT does not prove rollback.
  pagination:
    retention_seconds: 600
    consistency: Immutable snapshot, bound to user, resource, permissions, page size and sort. No filters are accepted in v1.
    token_error: INVALID_ARGUMENT for invalid, expired, cross-user, cross-resource or changed-size tokens. Revoked credentials remain UNAUTHENTICATED.
    order: Ascending ID except audit/logs/sessions, which use timestamp then ID. Audit/logs use occurred_at; sessions use created_at.
    last_page: Omit next_page_token.
    stream: Subscribe and receive SESSION_READY before fetching REST snapshots; buffer stream events during snapshot fetch and refresh affected resources afterwards.
  plugin_commands: 202 means durably accepted, not completed. Enable/disable controls registration and new delivery, without claiming process start or cancellation of existing external effects. Query plugin status/health for completion.
  plugin_configuration: Config writes compare expected_version before commit and persist non-secret control values. Successful writes confirm persistence only. GET includes live delivery status; APPLIED requires a matching plugin.config.v1 acknowledgement.
  limits: Login is limited to 30 attempts per normalized username per minute. At most 4096 unexpired authentication sessions, 10000 retained successful receipts and 1024 in-memory page cursors. Exceeding a limit returns RATE_LIMITED.
  audit: Every mutation, authorization denial and authentication failure records a stable outcome without credentials or message bodies. Audit failure prevents new effects.
paths:
  /health/live:
    servers: [{ url: / }]
    get:
      operationId: getProcessLiveness
      x-permission: public
      x-process-probe: true
      security: []
      summary: Process liveness without database access
      responses:
        '200':
          description: The HTTP process is alive, independent of storage readiness
          content: { application/json: { schema: { $ref: '#/components/schemas/ProcessProbe' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '500': { $ref: '#/components/responses/Internal' }
  /health/ready:
    servers: [{ url: / }]
    get:
      operationId: getProcessReadiness
      x-permission: public
      x-process-probe: true
      security: []
      summary: Readiness after migration and a successful storage write probe
      responses:
        '200':
          description: Core transports started and runtime storage accepts transactions
          content: { application/json: { schema: { $ref: '#/components/schemas/ProcessProbe' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /auth/me:
    get:
      operationId: getCurrentPrincipal
      x-permission: session.read
      summary: Return the current session and server-computed roles and permissions
      responses:
        '200':
          description: Current authenticated principal
          content: { application/json: { schema: { $ref: '#/components/schemas/Principal' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/Unavailable' }
        '504': { $ref: '#/components/responses/Timeout' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /auth/sessions:
    get:
      operationId: listSessions
      x-permission: session.read
      summary: List visible authentication sessions
      parameters: [{ $ref: '#/components/parameters/PageSize' }, { $ref: '#/components/parameters/PageToken' }]
      responses:
        '200':
          description: Session page, never containing tokens or token hashes
          content: { application/json: { schema: { $ref: '#/components/schemas/SessionPage' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/Unavailable' }
        '504': { $ref: '#/components/responses/Timeout' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /auth/sessions/{sessionId}/revoke:
    post:
      operationId: revokeSession
      x-permission: session.revoke
      summary: Revoke a visible session and its credentials
      parameters: [{ $ref: '#/components/parameters/SessionId' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '204': { description: Revoked or already revoked; an unknown or invisible session returns NOT_FOUND }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/Unavailable' }
        '504': { $ref: '#/components/responses/Timeout' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '404': { $ref: '#/components/responses/NotFound' }
  /auth/login:
    post:
      security: []
      operationId: login
      x-permission: public
      summary: Create an access and refresh token pair
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPair' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/Unavailable' }
        '504': { $ref: '#/components/responses/Timeout' }
        '409': { $ref: '#/components/responses/Conflict' }
  /auth/refresh:
    post:
      security: []
      operationId: refreshToken
      x-permission: refresh.credential
      summary: Rotate an access token
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        '200':
          description: Rotated token pair
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPair' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/Unavailable' }
        '504': { $ref: '#/components/responses/Timeout' }
        '409': { $ref: '#/components/responses/Conflict' }
  /health:
    get:
      operationId: getHealth
      x-permission: health.read
      summary: Return aggregate readiness and dependency state
      responses:
        '200':
          description: Ready or degraded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
        '503': { $ref: '#/components/responses/Unavailable' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/Internal' }
        '504': { $ref: '#/components/responses/Timeout' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /adapters:
    get:
      operationId: listAdapters
      x-permission: adapter.read
      summary: List adapter instances
      parameters: [{ $ref: '#/components/parameters/PageSize' }, { $ref: '#/components/parameters/PageToken' }]
      responses:
        '200':
          description: Adapter page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdapterPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/Internal' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '503': { $ref: '#/components/responses/Unavailable' }
        '504': { $ref: '#/components/responses/Timeout' }
  /plugins:
    get:
      operationId: listPlugins
      x-permission: plugin.read
      summary: List installed plugins
      parameters: [{ $ref: '#/components/parameters/PageSize' }, { $ref: '#/components/parameters/PageToken' }]
      responses:
        '200':
          description: Plugin page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PluginPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/Internal' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '503': { $ref: '#/components/responses/Unavailable' }
        '504': { $ref: '#/components/responses/Timeout' }
  /plugins/validate:
    post:
      operationId: validatePlugin
      x-permission: plugin.manage
      summary: Validate a plugin manifest without enabling it
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PluginManifest' }
      responses:
        '200':
          description: Validation result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/Internal' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }
        '504': { $ref: '#/components/responses/Timeout' }
        '409': { $ref: '#/components/responses/Conflict' }
  /plugins/{pluginId}/enable:
    post:
      operationId: enablePlugin
      x-permission: plugin.manage
      summary: Enable a validated plugin
      parameters: [{ $ref: '#/components/parameters/PluginId' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '202': { description: Enable request accepted }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/Internal' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '503': { $ref: '#/components/responses/Unavailable' }
        '504': { $ref: '#/components/responses/Timeout' }
  /plugins/{pluginId}/disable:
    post:
      operationId: disablePlugin
      x-permission: plugin.manage
      summary: Disable a plugin and pause its tasks
      parameters: [{ $ref: '#/components/parameters/PluginId' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '202': { description: Disable request accepted }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/Internal' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '503': { $ref: '#/components/responses/Unavailable' }
        '504': { $ref: '#/components/responses/Timeout' }
        '409': { $ref: '#/components/responses/Conflict' }
  /plugins/{pluginId}/config:
    get:
      operationId: getPluginConfig
      x-permission: plugin.config.read
      summary: Read a plugin configuration
      parameters: [{ $ref: '#/components/parameters/PluginId' }]
      responses:
        '200':
          description: Versioned configuration
          content: { application/json: { schema: { $ref: '#/components/schemas/PluginConfig' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/Internal' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }
        '504': { $ref: '#/components/responses/Timeout' }
    put:
      operationId: updatePluginConfig
      x-permission: plugin.config.write
      summary: Replace a plugin configuration
      parameters: [{ $ref: '#/components/parameters/PluginId' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PluginConfigUpdate' } } }
      responses:
        '200':
          description: Updated configuration
          content: { application/json: { schema: { $ref: '#/components/schemas/PluginConfig' } } }
        '409': { $ref: '#/components/responses/Conflict' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/Internal' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '503': { $ref: '#/components/responses/Unavailable' }
        '504': { $ref: '#/components/responses/Timeout' }
        '404': { $ref: '#/components/responses/NotFound' }
  /plugins/{pluginId}/health:
    get:
      operationId: getPluginHealth
      x-permission: plugin.read
      summary: Return plugin health and dependency state
      parameters: [{ $ref: '#/components/parameters/PluginId' }]
      responses:
        '200':
          description: Plugin health
          content: { application/json: { schema: { $ref: '#/components/schemas/Health' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/Internal' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }
        '504': { $ref: '#/components/responses/Timeout' }
  /audit:
    get:
      operationId: listAuditEntries
      x-permission: audit.read
      summary: Query audit entries
      parameters: [{ $ref: '#/components/parameters/PageSize' }, { $ref: '#/components/parameters/PageToken' }]
      responses:
        '200':
          description: Audit page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/Internal' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }
        '504': { $ref: '#/components/responses/Timeout' }
  /bots:
    get:
      operationId: listBots
      x-permission: bot.read
      summary: List bot accounts
      parameters: [{ $ref: '#/components/parameters/PageSize' }, { $ref: '#/components/parameters/PageToken' }]
      responses:
        '200':
          description: Bot page
          content: { application/json: { schema: { $ref: '#/components/schemas/BotPage' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/Internal' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }
        '504': { $ref: '#/components/responses/Timeout' }
  /models:
    get:
      operationId: listModels
      x-permission: model.read
      summary: List configured model providers
      parameters: [{ $ref: '#/components/parameters/PageSize' }, { $ref: '#/components/parameters/PageToken' }]
      responses:
        '200':
          description: Model page
          content: { application/json: { schema: { $ref: '#/components/schemas/ModelPage' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/Internal' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }
        '504': { $ref: '#/components/responses/Timeout' }
  /groups:
    get:
      operationId: listGroups
      x-permission: group.read
      summary: List known groups
      parameters: [{ $ref: '#/components/parameters/PageSize' }, { $ref: '#/components/parameters/PageToken' }]
      responses:
        '200':
          description: Group page
          content: { application/json: { schema: { $ref: '#/components/schemas/GroupPage' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/Internal' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }
        '504': { $ref: '#/components/responses/Timeout' }
  /users:
    get:
      operationId: listUsers
      x-permission: user.read
      summary: List known users
      parameters: [{ $ref: '#/components/parameters/PageSize' }, { $ref: '#/components/parameters/PageToken' }]
      responses:
        '200':
          description: User page
          content: { application/json: { schema: { $ref: '#/components/schemas/UserPage' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/Internal' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }
        '504': { $ref: '#/components/responses/Timeout' }
  /tasks:
    get:
      operationId: listTasks
      x-permission: task.read
      summary: List scheduled tasks
      parameters: [{ $ref: '#/components/parameters/PageSize' }, { $ref: '#/components/parameters/PageToken' }]
      responses:
        '200':
          description: Task page
          content: { application/json: { schema: { $ref: '#/components/schemas/TaskPage' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/Internal' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }
        '504': { $ref: '#/components/responses/Timeout' }
  /actions/by-idempotency-key:
    get:
      operationId: getActionByIdempotencyKey
      x-permission: action.read
      summary: Find an action result using its idempotency key
      description: The key is scoped to the authenticated caller and must not be logged. Missing, expired, or invisible results return NOT_FOUND. Query timeout does not imply action failure.
      parameters: [{ $ref: '#/components/parameters/ActionLookupKey' }]
      responses:
        '200': { $ref: '#/components/responses/ActionResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/Unavailable' }
        '504': { $ref: '#/components/responses/Timeout' }
  /actions/{actionId}:
    get:
      operationId: getActionResult
      x-permission: action.read
      summary: Get an action result by ID
      description: Missing, expired, or invisible results return NOT_FOUND. The literal by-idempotency-key is reserved for key lookup.
      parameters: [{ $ref: '#/components/parameters/ActionId' }]
      responses:
        '200': { $ref: '#/components/responses/ActionResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/Unavailable' }
        '504': { $ref: '#/components/responses/Timeout' }
  /logs:
    get:
      operationId: listLogs
      x-permission: log.read
      summary: Query redacted structured logs
      parameters: [{ $ref: '#/components/parameters/PageSize' }, { $ref: '#/components/parameters/PageToken' }]
      responses:
        '200':
          description: Log page
          content: { application/json: { schema: { $ref: '#/components/schemas/LogPage' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/Internal' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }
        '504': { $ref: '#/components/responses/Timeout' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    SessionId:
      name: sessionId
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 256 }
    PageSize:
      name: page_size
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    PageToken:
      name: page_token
      in: query
      schema: { type: string, maxLength: 1024 }
    PluginId:
      name: pluginId
      in: path
      required: true
      schema: { type: string, pattern: '^[a-z0-9][a-z0-9.-]{1,63}$' }
    ActionId:
      name: actionId
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 256 }
    ActionLookupKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Action idempotency key, scoped to the authenticated caller.
      schema: { type: string, minLength: 1, maxLength: 256 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Replays return the committed response for 24 hours within the x-control-policy scope. Token response replay requires an active session and current generation; otherwise 401.
      schema: { type: string, minLength: 16, maxLength: 128 }
  responses:
    ActionResult:
      description: Current action status; a query timeout does not change the action status.
      content: { application/json: { schema: { $ref: '#/components/schemas/ActionResult' } } }
    BadRequest:
      description: Invalid request (INVALID_ARGUMENT)
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Unauthorized:
      description: Missing or invalid credentials (UNAUTHENTICATED)
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    NotFound:
      description: Resource not found or not visible (NOT_FOUND)
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Conflict:
      description: State conflict
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Unavailable:
      description: Core or a required plugin/capability is unavailable (UPSTREAM_UNAVAILABLE, PLUGIN_UNAVAILABLE, CAPABILITY_NOT_SUPPORTED)
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Forbidden:
      description: Authenticated but not authorized (PERMISSION_DENIED)
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    RateLimited:
      description: Rate limit exceeded (RATE_LIMITED)
      headers:
        Retry-After: { schema: { type: integer, minimum: 1 } }
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Internal:
      description: Internal server error (INTERNAL)
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Timeout:
      description: Query timed out (TIMEOUT); action outcome may remain unknown
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
  schemas:
    ProcessProbe:
      type: object
      required: [state]
      additionalProperties: false
      properties:
        state: { $ref: '#/components/schemas/HealthState' }
    Principal:
      type: object
      required: [user_id, session_id, roles, permissions]
      properties:
        user_id: { type: string }
        session_id: { type: string }
        roles: { type: array, items: { type: string, enum: [admin, operator, viewer] } }
        permissions: { type: array, items: { type: string } }
    Session:
      type: object
      required: [session_id, user_id, created_at, expires_at, state]
      properties:
        session_id: { type: string }
        user_id: { type: string }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        state: { type: string, enum: [ACTIVE, REVOKED, EXPIRED] }
    SessionPage:
      type: object
      required: [items, page]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Session' } }
        page: { $ref: '#/components/schemas/PageInfo' }
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9_.-]+$', description: 'ASCII username, case-insensitive' }
        password: { type: string, minLength: 1, maxLength: 1024, format: password }
    RefreshRequest:
      type: object
      required: [refresh_token]
      properties: { refresh_token: { type: string, minLength: 20, maxLength: 4096 } }
    TokenPair:
      type: object
      required: [access_token, refresh_token, expires_in]
      properties:
        access_token: { type: string }
        refresh_token: { type: string }
        expires_in: { type: integer, format: int32 }
    Error:
      type: object
      required: [code, message, request_id]
      properties:
        code: { $ref: '#/components/schemas/ErrorCode' }
        message: { type: string }
        request_id: { type: string }
        trace_id: { type: string }
        retryable: { type: boolean, default: false }
        details: { type: object, additionalProperties: { type: string } }
    ErrorCode:
      type: string
      enum: [ERROR_CODE_UNSPECIFIED, INVALID_ARGUMENT, UNAUTHENTICATED, PERMISSION_DENIED, NOT_FOUND, CONFLICT, CAPABILITY_NOT_SUPPORTED, RATE_LIMITED, TIMEOUT, UPSTREAM_UNAVAILABLE, PLUGIN_UNAVAILABLE, INTERNAL]
    PageInfo:
      type: object
      properties:
        next_page_token: { type: string }
        page_size: { type: integer }
    HealthState:
      type: string
      enum: [HEALTH_STATE_UNSPECIFIED, HEALTHY, DEGRADED, UNHEALTHY]
    Health:
      type: object
      required: [state, components]
      properties:
        state: { $ref: '#/components/schemas/HealthState' }
        components: { type: array, items: { $ref: '#/components/schemas/HealthComponent' } }
    HealthComponent:
      type: object
      required: [component, state]
      properties:
        component: { type: string }
        state: { $ref: '#/components/schemas/HealthState' }
        reason: { type: string }
    Adapter:
      type: object
      required: [id, state, implementation]
      properties:
        id: { type: string }
        state: { $ref: '#/components/schemas/HealthState' }
        implementation: { type: string }
        version: { type: string }
        capabilities: { type: array, items: { type: string } }
    PluginManifest:
      type: object
      required: [id, name, version, api_version, runtime]
      properties:
        id: { type: string, pattern: '^[a-z0-9][a-z0-9.-]{1,63}$' }
        name: { type: string }
        version: { type: string }
        api_version: { type: string }
        runtime: { type: string, enum: [python-rpc, cpp-rpc, cpp-native] }
        isolation: { type: string, enum: [process, native, wasm], default: process }
        ordered: { type: boolean, default: false }
        permissions: { type: array, items: { type: string } }
    Plugin:
      allOf:
        - $ref: '#/components/schemas/PluginManifest'
        - type: object
          required: [state]
          properties:
            state: { $ref: '#/components/schemas/PluginState' }
    PluginState:
      type: string
      enum: [PLUGIN_STATE_UNSPECIFIED, PLUGIN_STATE_DISABLED, PLUGIN_STATE_STARTING, PLUGIN_STATE_READY, PLUGIN_STATE_RUNNING, PLUGIN_STATE_STOPPING, PLUGIN_STATE_STOPPED, PLUGIN_STATE_UNAVAILABLE, PLUGIN_STATE_FAILED]
    ActionStatus:
      type: string
      enum: [ACTION_STATUS_UNSPECIFIED, ACCEPTED, SUCCEEDED, FAILED, EXPIRED, CANCELLED]
    ActionResult:
      type: object
      required: [action_id, status]
      description: ACCEPTED is pending; terminal results are retained for seven days.
      properties:
        action_id: { type: string }
        status: { $ref: '#/components/schemas/ActionStatus' }
        platform_message_id: { type: string }
        error: { $ref: '#/components/schemas/Error' }
        completed_at: { type: string, format: date-time }
      oneOf:
        - required: [status]
          properties: { status: { type: string, enum: [ACCEPTED] } }
        - required: [status, completed_at, error]
          properties: { status: { type: string, enum: [FAILED] } }
        - required: [status, completed_at]
          properties: { status: { type: string, enum: [SUCCEEDED, EXPIRED, CANCELLED] } }
    PluginConfig:
      type: object
      required: [version, values]
      properties:
        delivery: { $ref: '#/components/schemas/PluginConfigDelivery' }
        version: { type: string }
        values: { type: object, additionalProperties: true }
    PluginConfigDelivery:
      type: object
      additionalProperties: false
      required: [state]
      properties:
        state: { type: string, enum: [UNAVAILABLE, PENDING, APPLIED, REJECTED] }
        applied_version: { type: string }
        error: { $ref: '#/components/schemas/Error' }
      description: >-
        GET-only live observation. UNAVAILABLE means no negotiated active connection;
        PENDING means the desired version is not confirmed; APPLIED means its callback
        completed on this connection; REJECTED includes a sanitized callback error or TIMEOUT.
        Applied version is scoped to the active connection and is cleared on reconnect.
        PUT responses and idempotent replays confirm persistence, not application.
    PluginConfigUpdate:
      type: object
      required: [expected_version, values]
      properties:
        expected_version: { type: string, minLength: 1, maxLength: 128 }
        values: { type: object, additionalProperties: true }
    ValidationResult:
      type: object
      required: [valid, errors]
      properties:
        valid: { type: boolean }
        errors: { type: array, items: { type: string } }
    AuditEntry:
      type: object
      required: [id, occurred_at, actor, action]
      properties:
        id: { type: string }
        occurred_at: { type: string, format: date-time }
        actor: { type: string }
        action: { type: string }
        resource: { type: string }
        request_id: { type: string }
    AdapterPage:
      type: object
      required: [items, page]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Adapter' } }
        page: { $ref: '#/components/schemas/PageInfo' }
    PluginPage:
      type: object
      required: [items, page]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Plugin' } }
        page: { $ref: '#/components/schemas/PageInfo' }
    AuditPage:
      type: object
      required: [items, page]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/AuditEntry' } }
        page: { $ref: '#/components/schemas/PageInfo' }
    GenericResource:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }
        state: { type: string }
        created_at: { type: string, format: date-time }
    Group:
      allOf:
        - $ref: '#/components/schemas/GenericResource'
        - type: object
          required: [roles, permissions]
          properties:
            roles: { type: array, items: { type: string }, description: Roles assigned to this group }
            permissions: { type: array, items: { type: string }, description: Effective permission identifiers }
    User:
      allOf:
        - $ref: '#/components/schemas/GenericResource'
        - type: object
          required: [groups, roles, permissions]
          properties:
            groups: { type: array, items: { type: string }, description: Group identifiers }
            roles: { type: array, items: { type: string }, description: Effective role identifiers }
            permissions: { type: array, items: { type: string }, description: Effective permission identifiers }
    LogEntry:
      allOf:
        - $ref: '#/components/schemas/GenericResource'
        - type: object
          required: [occurred_at, level, component, message]
          properties:
            occurred_at: { type: string, format: date-time }
            level: { type: string, enum: [DEBUG, INFO, WARN, ERROR] }
            component: { type: string }
            message: { type: string, description: Redacted log message }
            trace_id: { type: string }
    BotPage:
      type: object
      required: [items, page]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/GenericResource' } }
        page: { $ref: '#/components/schemas/PageInfo' }
    ModelPage:
      type: object
      required: [items, page]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/GenericResource' } }
        page: { $ref: '#/components/schemas/PageInfo' }
    GroupPage:
      type: object
      required: [items, page]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Group' } }
        page: { $ref: '#/components/schemas/PageInfo' }
    UserPage:
      type: object
      required: [items, page]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/User' } }
        page: { $ref: '#/components/schemas/PageInfo' }
    TaskPage:
      type: object
      required: [items, page]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/GenericResource' } }
        page: { $ref: '#/components/schemas/PageInfo' }
    LogPage:
      type: object
      required: [items, page]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/LogEntry' } }
        page: { $ref: '#/components/schemas/PageInfo' }
