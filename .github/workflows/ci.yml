name: CI

# 自动触发仍暂停：先手动 Run workflow 验证全绿，再恢复 pull_request / push 触发器。
# 2026-10-31 更新：descriptor 基线支持从上一发布版 Release 资产下载；新增 Clang 16
# full 构建 + 全模块静态分析 job；依赖审计扩展到 panel 与 Python（report-only）。
# 2026-11-02 更新：contracts/full-build 改为从 dependencies/architecture 的锁定
# manifest 安装固定版本依赖（不再用经典 vcpkg 包列表）；full-build 的 full CTest
# 仍被 P00 fixture 环境（PG16.4/OpenSSL3.5/Python venv）阻塞，见 doc/12-ci-cd.md。
# 恢复步骤见 doc/12-ci-cd.md「恢复自动触发」。
on:
  workflow_dispatch:
    inputs:
      base_ref:
        description: 'Descriptor 基线提交（必须与 HEAD 不同；main 手动运行默认 origin/main 会自比并被拒绝，需显式给上一提交/tag）'
        required: false
        default: origin/main
        type: string
      baseline_release:
        description: '可选：上一发布版 descriptor 的 GitHub Release tag（设置后从 release 资产下载并做发布兼容比较）'
        required: false
        default: ''
        type: string
  # 自动触发已接入但默认门控：仓库变量 CI_AUTO_ENABLED=true 后才执行 job。
  # 首次启用前先手动 Run workflow 跑绿 full-build（doc/12-ci-cd.md「恢复自动触发」）。
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    if: github.event_name == 'workflow_dispatch' || vars.CI_AUTO_ENABLED == 'true'
    name: Build and test (${{ matrix.name }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GCC 13
            cc: gcc-13
            cxx: g++-13
            packages: gcc-13 g++-13
          - name: Clang 16
            cc: clang-16
            cxx: clang++-16
            packages: clang-16
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.packages }}
      - name: Configure dev
        run: cmake --preset dev
      - name: Build dev
        run: cmake --build --preset dev --parallel 2
      - name: Test dev
        run: ctest --preset dev --no-tests=error

  contracts:
    if: github.event_name == 'workflow_dispatch' || vars.CI_AUTO_ENABLED == 'true'
    name: Protocol compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      VCPKG_ROOT: ${{ github.workspace }}/.ci-vcpkg
      VCPKG_MAX_CONCURRENCY: 2
      PROTOBUF_INCLUDE_DIR: ${{ github.workspace }}/.ci-vcpkg/installed/x64-linux/include
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Check out pinned vcpkg registry and tool
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: microsoft/vcpkg
          ref: ce613c41372b23b1f51333815feb3edd87ef8a8b # 2025.04.09
          path: .ci-vcpkg
          persist-credentials: false
      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-13 g++-13 autoconf automake bison flex libtool perl \
            pkg-config ninja-build python3-venv ruby tzdata
      - name: Verify pinned vcpkg registry against the dependency lock
        # Offline gate: registry revision, baseline port versions, port trees and
        # portfile hashes must match dependencies/architecture/dependencies.lock.json
        # (doc/11-toolchain.md). Runs before the expensive dependency build.
        run: python3 scripts/quality/check-dependency-lock.py --registry "$VCPKG_ROOT"
      - name: Install locked architecture dependencies
        # GENERATE_PROTO=ON always adds dependencies/architecture/smoke plus
        # infrastructure/postgres and infrastructure/identity_crypto, which require
        # the manifest's exact versions (OpenSSL 3.5.0 EXACT, nlohmann_json 3.11.3
        # EXACT, libpqxx 7.10.0, jwt-cpp, libpq). A classic `vcpkg install <port>`
        # list cannot express those override versions.
        run: |
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics
          "$VCPKG_ROOT/vcpkg" install \
            --x-manifest-root="$GITHUB_WORKSPACE/dependencies/architecture" \
            --triplet=x64-linux \
            --x-install-root="$VCPKG_ROOT/installed" \
            --clean-after-build
          echo "$VCPKG_ROOT/installed/x64-linux/tools/protobuf" >> "$GITHUB_PATH"
          echo "$VCPKG_ROOT/installed/x64-linux/tools/grpc" >> "$GITHUB_PATH"
      - name: Install locked Python SDK test environment
        # The proto preset builds the default (ALL) target, which includes
        # kiarabot_python_proto_generate and therefore needs sdk/python/.venv.
        run: |
          python3 -m venv /tmp/kiarabot-ci-uv
          /tmp/kiarabot-ci-uv/bin/pip install uv==0.13.6
          /tmp/kiarabot-ci-uv/bin/uv sync --project sdk/python --locked --python 3.11.18
          /tmp/kiarabot-ci-uv/bin/uv sync --project control/api/tests --locked --python 3.11.18
      - name: Configure proto
        env:
          CC: gcc-13
          CXX: g++-13
        # Dependencies were installed from the locked manifest into
        # $VCPKG_ROOT/installed by the previous steps, so classic toolchain mode
        # (VCPKG_MANIFEST_MODE=OFF) reuses exactly that tree.
        run: >-
          cmake --preset proto
          -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_MANIFEST_MODE=OFF
          -DKIARABOT_ENABLE_INFRASTRUCTURE=ON
      - name: Build proto and compatibility tool
        run: cmake --build --preset proto --parallel 2
      - name: Install locked adapter test environment
        run: /tmp/kiarabot-ci-uv/bin/uv sync --project adapters/nonebot --locked --python 3.11.18
      - name: Test Core and mixed-language closed loop
        env:
          KIARABOT_ADAPTER_DIR: ${{ github.workspace }}/adapters/nonebot
        run: bash -x tests/acceptance/run.sh
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.14.0'
      - name: Test TypeScript panel against Core
        run: |
          npm ci --prefix panel --no-audit --no-fund
          npm run check:contracts --prefix panel
          npm run lint --prefix panel
          npm test --prefix panel
          npm run build --prefix panel
      - name: Compare with base commit descriptor
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || inputs.base_ref }}
          # The contracts job has the locked SDK venv and generated package by now;
          # enforce the legacy Python reader test on CI while keeping it opt-in locally.
          KIARABOT_LEGACY_READER_TEST: '1'
        run: scripts/ci/check-descriptor.sh "$BASE_SHA"
      - name: Verify incompatible descriptors fail
        run: scripts/ci/test-descriptor-gate.sh
      - name: Download previous release descriptor (optional)
        if: inputs.baseline_release != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p baseline
          gh release download "${{ inputs.baseline_release }}" --pattern 'kiarabot-v1.pb' --dir baseline
          test -s baseline/kiarabot-v1.pb
      - name: Compare with previous release descriptor (optional)
        if: inputs.baseline_release != ''
        env:
          KIARABOT_LEGACY_READER_TEST: '1'
        run: KIARABOT_BASELINE_DESCRIPTOR="$PWD/baseline/kiarabot-v1.pb" ./proto/tests/check_contracts.sh
      - name: Save descriptor for this commit
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: descriptor-${{ github.sha }}
          path: build/proto/generated/kiarabot-v1.pb
          if-no-files-found: error
          retention-days: 14

  workflow-lint:
    if: github.event_name == 'workflow_dispatch' || vars.CI_AUTO_ENABLED == 'true'
    name: Workflow lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.25.1'
          cache: false
      - name: Install YAML parser
        run: sudo apt-get update && sudo apt-get install -y python3-yaml
      - name: Parse workflow YAML
        run: |
          python3 - .github/workflows/*.yml <<'PY'
          import sys

          import yaml

          for path in sys.argv[1:]:
              with open(path, encoding="utf-8") as handle:
                  yaml.safe_load(handle)
              print(f"Parsed {path}")
          PY
      - name: Check tracked shell syntax
        run: git ls-files -z '*.sh' | xargs -0 -r bash -n
      - name: Run actionlint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          "$(go env GOPATH)/bin/actionlint"

  format:
    if: github.event_name == 'workflow_dispatch' || vars.CI_AUTO_ENABLED == 'true'
    name: C++ format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: sudo apt-get update && sudo apt-get install -y clang-format-16
      - name: Check handwritten C++
        run: git ls-files -z 'core/*.cpp' 'core/*.h' 'core/*.hpp' 'proto/tests/*.cc' 'control/*.cpp' 'control/*.hpp' 'infrastructure/*.cpp' 'infrastructure/*.hpp' | xargs -0 -r clang-format-16 --dry-run --Werror

  clang-tidy:
    if: github.event_name == 'workflow_dispatch' || vars.CI_AUTO_ENABLED == 'true'
    name: C++ static analysis
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: sudo apt-get update && sudo apt-get install -y clang-16 clang-tidy-16
      - name: Configure compile database
        env:
          CC: clang-16
          CXX: clang++-16
        run: cmake --preset dev -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
      - name: Analyze all dev translation units
        run: |
          mapfile -t files < <(python3 - <<'PY'
          import json

          with open('build/dev/compile_commands.json', encoding='utf-8') as handle:
              for entry in json.load(handle):
                  print(entry['file'])
          PY
          )
          clang-tidy-16 -p build/dev --checks='clang-analyzer-*' \
            --warnings-as-errors='*' --header-filter="$GITHUB_WORKSPACE/(core|proto|control|infrastructure)/" \
            "${files[@]}"

  api-contracts:
    if: github.event_name == 'workflow_dispatch' || vars.CI_AUTO_ENABLED == 'true'
    name: API contracts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.14.0'
      - run: npm ci --prefix scripts/ci --ignore-scripts --no-audit --no-fund
      - name: Install YAML parser
        run: sudo apt-get update && sudo apt-get install -y python3-yaml
      - name: Parse API YAML
        run: |
          python3 - api/openapi.yaml api/asyncapi.yaml <<'PY'
          import sys

          import yaml

          for path in sys.argv[1:]:
              with open(path, encoding="utf-8") as handle:
                  yaml.safe_load(handle)
              print(f"Parsed {path}")
          PY
      - name: Lint OpenAPI
        run: scripts/ci/node_modules/.bin/redocly lint api/openapi.yaml
      - name: Parse and validate AsyncAPI
        run: node scripts/ci/validate-asyncapi.cjs api/asyncapi.yaml

  dependency-scan:
    if: github.event_name == 'workflow_dispatch' || vars.CI_AUTO_ENABLED == 'true'
    name: Dependency scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.14.0'
      - name: Audit locked CI dependencies
        run: npm audit --prefix scripts/ci --audit-level=high
      # Panel and Python audits are report-only until their findings are triaged:
      # they must not be described as complete dependency coverage (see doc/12-ci-cd.md).
      - name: Audit panel dependencies (report-only)
        continue-on-error: true
        run: npm audit --prefix panel --package-lock-only --audit-level=high
      - name: Audit Python SDK and control dependencies (report-only)
        continue-on-error: true
        run: |
          python3 -m venv /tmp/kiarabot-audit
          /tmp/kiarabot-audit/bin/pip install --quiet uv==0.13.6 pip-audit
          /tmp/kiarabot-audit/bin/uv export --project sdk/python --locked --no-hashes --format requirements-txt > /tmp/sdk-req.txt
          /tmp/kiarabot-audit/bin/uv export --project control/api/tests --locked --no-hashes --format requirements-txt > /tmp/control-req.txt
          /tmp/kiarabot-audit/bin/pip-audit -r /tmp/sdk-req.txt
          /tmp/kiarabot-audit/bin/pip-audit -r /tmp/control-req.txt

  secret-scan:
    if: github.event_name == 'workflow_dispatch' || vars.CI_AUTO_ENABLED == 'true'
    name: Secret scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.25.1'
          cache: false
      - name: Scan Git history
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.28.0
          "$(go env GOPATH)/bin/gitleaks" git --config .gitleaks.toml --redact --no-banner \
            --exit-code=1 --report-format json --report-path gitleaks-report.json .
      - name: Upload secret scan findings
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gitleaks-report-${{ github.sha }}
          path: gitleaks-report.json
          if-no-files-found: ignore
          retention-days: 7

  boundaries:
    if: github.event_name == 'workflow_dispatch' || vars.CI_AUTO_ENABLED == 'true'
    name: Boundaries and static quality
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install helpers
        run: sudo apt-get update && sudo apt-get install -y python3 python3-yaml ruby ripgrep
      - name: Check module boundaries
        run: python3 scripts/quality/check-boundaries.py
      - name: Check tracked shell syntax
        run: git ls-files -z '*.sh' | xargs -0 -r bash -n

  python-panel:
    if: github.event_name == 'workflow_dispatch' || vars.CI_AUTO_ENABLED == 'true'
    name: SDK/adapter/control pytest and panel gates
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.14.0'
      - name: Install uv and locked Python environments
        run: |
          python3 -m venv /tmp/kiarabot-ci-uv
          /tmp/kiarabot-ci-uv/bin/pip install uv==0.13.6
          /tmp/kiarabot-ci-uv/bin/uv sync --project sdk/python --locked --python 3.11.18
          /tmp/kiarabot-ci-uv/bin/uv sync --project adapters/nonebot --locked --python 3.11.18
      - name: Generate Python protocol stubs
        run: |
          sdk/python/.venv/bin/python sdk/python/tools/generate_proto.py
          adapters/nonebot/.venv/bin/python adapters/nonebot/tools/generate_proto.py proto
      - name: Python SDK tests
        run: |
          cd sdk/python
          PYTHONPATH=src:build/generated .venv/bin/python -m pytest -q
      - name: Adapter tests
        run: |
          cd adapters/nonebot
          PYTHONPATH=src:generated .venv/bin/python -m pytest -q
      - name: Panel contract/lint/test/build (locked Node 22.14.0)
        run: |
          npm ci --prefix panel --no-audit --no-fund
          npm run check:contracts --prefix panel
          npm run lint --prefix panel
          npm test --prefix panel
          npm run build --prefix panel

  images-dry-run:
    if: github.event_name == 'workflow_dispatch' || vars.CI_AUTO_ENABLED == 'true'
    name: Target images and compose config (no registry credentials)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate compose configuration
        run: |
          docker compose --env-file deploy/target.env.example             -f deploy/compose.infra.yml -f deploy/compose.core.yml             -f deploy/compose.exec.yml config -q
      - name: Build target suite/panel/adapter images (no push)
        run: |
          docker buildx version
          for target in identity runtime tools; do
            docker build -f deploy/docker/suite.Dockerfile --target "$target" \
              --build-arg UBUNTU_BASE="${UBUNTU_BASE:-ubuntu:24.04}" \
              -t "kiarabot-${target}:ci" .
          done
          docker build -f deploy/docker/panel.Dockerfile -t kiarabot-panel:ci .
          docker build -f deploy/docker/adapter.Dockerfile -t kiarabot-adapter:ci .
      - name: Record image digests
        run: |
          for image in kiarabot-identity kiarabot-runtime kiarabot-tools kiarabot-panel kiarabot-adapter; do
            docker image inspect "$image:ci" --format '{{.Id}}' || true
          done

  full-build:
    if: github.event_name == 'workflow_dispatch' || vars.CI_AUTO_ENABLED == 'true'
    name: Full build and static analysis (Clang 16)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      VCPKG_ROOT: ${{ github.workspace }}/.ci-vcpkg
      VCPKG_MAX_CONCURRENCY: 2
      PROTOBUF_INCLUDE_DIR: ${{ github.workspace }}/.ci-vcpkg/installed/x64-linux/include
      CC: clang-16
      CXX: clang++-16
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Check out pinned vcpkg registry and tool
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: microsoft/vcpkg
          ref: ce613c41372b23b1f51333815feb3edd87ef8a8b # 2025.04.09
          path: .ci-vcpkg
          persist-credentials: false
      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-16 clang-tidy-16 autoconf automake bison flex libtool perl \
            pkg-config ninja-build python3-venv ruby tzdata
      - name: Install locked P00 fixtures (OpenSSL 3.5.0, PostgreSQL 16.4)
        # The full-locked CTest suite requires the exact P00 fixture versions
        # (doc/11-toolchain.md). Archives come from the lock URLs and are hash-
        # verified before extraction; builds stay in ignored build/. OpenSSL is
        # built first because PostgreSQL links against it.
        run: |
          set -euo pipefail
          lock=dependencies/architecture/dependencies.lock.json
          mkdir -p build/p00/archives
          ssl_sha="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["openssl-cli"]["sha512"])' "$lock")"
          ssl_url="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["openssl-cli"]["url"])' "$lock")"
          curl -fsSL "$ssl_url" -o build/p00/archives/openssl-3.5.0.tar.gz
          echo "${ssl_sha}  build/p00/archives/openssl-3.5.0.tar.gz" | sha512sum -c -
          tar -xzf build/p00/archives/openssl-3.5.0.tar.gz -C build/p00
          (
            cd build/p00/openssl-openssl-3.5.0
            ./Configure shared no-tests no-docs --prefix="$PWD/../../p00/openssl"
            make -j2
            make install_sw install_ssldirs
          )
          pg_sha="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["postgresql"]["sha512"])' "$lock")"
          pg_url="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["postgresql"]["url"])' "$lock")"
          curl -fsSL "$pg_url" -o build/p00/archives/postgresql-16.4.tar.bz2
          echo "${pg_sha}  build/p00/archives/postgresql-16.4.tar.bz2" | sha512sum -c -
          tar -xjf build/p00/archives/postgresql-16.4.tar.bz2 -C build/p00
          (
            cd build/p00/postgresql-16.4
            PKG_CONFIG_PATH="$PWD/../../p00/openssl/lib/pkgconfig" \
            CPPFLAGS="-I$PWD/../../p00/openssl/include" \
            LDFLAGS="-L$PWD/../../p00/openssl/lib -Wl,-rpath,$PWD/../../p00/openssl/lib" \
            ./configure --prefix="$PWD/../../p00/pg" --with-openssl \
              --without-readline --without-icu --without-zlib
            make -j2
            make install
          )
          echo "$PWD/build/p00/pg/bin" >> "$GITHUB_PATH"
          echo "$PWD/build/p00/openssl/bin" >> "$GITHUB_PATH"
          echo "KIARABOT_TEST_PG_BIN=$PWD/build/p00/pg/bin" >> "$GITHUB_ENV"
          echo "KIARABOT_TEST_OPENSSL=$PWD/build/p00/openssl/bin/openssl" >> "$GITHUB_ENV"
      - name: Configure full-locked target preset
        # Dependencies were installed from the locked manifest into
        # $VCPKG_ROOT/installed by the previous steps. The P00 fixture paths are
        # explicit so CTest does not silently skip environment-gated tests.
        run: >-
          cmake --preset full-locked -B build/full-locked
          -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_MANIFEST_MODE=OFF
          -DVCPKG_INSTALLED_DIR="$VCPKG_ROOT/installed"
          -DPython3_EXECUTABLE="$GITHUB_WORKSPACE/sdk/python/.venv/bin/python"
          -DKIARABOT_TARGET_PYTHON="$GITHUB_WORKSPACE/sdk/python/.venv/bin/python"
          -DKIARABOT_TEST_OPENSSL="$GITHUB_WORKSPACE/build/p00/openssl/bin/openssl"
          -DKIARABOT_TEST_PG_BIN="$GITHUB_WORKSPACE/build/p00/pg/bin"
      - name: Build full-locked target preset
        run: |
          set -o pipefail
          cmake --build build/full-locked --parallel 2 2>&1 | tee build-full-locked.log
      - name: Test full-locked target preset
        # No -E/label filtering: the full-locked CTest suite is the gate.
        run: ctest --test-dir build/full-locked --output-on-failure
      - name: Unified local CI entry (test + contracts, JSON evidence)
        env:
          KIARABOT_DESCRIPTOR_COMPATIBILITY_TOOL: ${{ github.workspace }}/build/full-locked/kiarabot_descriptor_compatibility
          PROTOBUF_INCLUDE_DIR: ${{ env.VCPKG_ROOT }}/installed/x64-linux/include
        run: |
          scripts/run-ci-local.sh test --json build/ci-local/test.json
          scripts/run-ci-local.sh contracts --json build/ci-local/contracts.json
      - name: Upload unified CI evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-local-evidence-${{ github.sha }}
          path: build/ci-local/
          if-no-files-found: ignore
          retention-days: 14
      - name: Analyze all full-locked translation units
        run: |
          mapfile -t files < <(python3 - <<'PY'
          import json

          with open('build/full-locked/compile_commands.json', encoding='utf-8') as handle:
              for entry in json.load(handle):
                  print(entry['file'])
          PY
          )
          clang-tidy-16 -p build/full-locked --checks='clang-analyzer-*' \
            --warnings-as-errors='*' --header-filter="$GITHUB_WORKSPACE/(core|proto|control|infrastructure)/" \
            "${files[@]}"
      - name: Upload full-locked build log and test output on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: full-build-log-${{ github.sha }}
          path: |
            build-full-locked.log
            build/full-locked/Testing/Temporary/
          if-no-files-found: ignore
          retention-days: 7
  ci-evidence:
    name: Unified CI evidence summary
    runs-on: ubuntu-24.04
    if: always() && (github.event_name == 'workflow_dispatch' || vars.CI_AUTO_ENABLED == 'true')
    needs:
      - build-test
      - contracts
      - workflow-lint
      - format
      - clang-tidy
      - api-contracts
      - dependency-scan
      - secret-scan
      - boundaries
      - python-panel
      - images-dry-run
      - full-build
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Download unified local CI evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: ci-local-evidence-*
          path: build/ci-local
          merge-multiple: true
      - name: Write machine-readable CI summary
        env:
          NEEDS: ${{ toJSON(needs) }}
          WORKFLOW: ${{ github.workflow }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ['GITHUB_WORKSPACE'])
          workspace = root
          needs = json.loads(os.environ['NEEDS'])
          jobs = {name: {'result': value.get('result'), 'outputs': value.get('outputs', {})}
                  for name, value in needs.items()}
          failed = [name for name, value in jobs.items()
                    if value['result'] not in ('success', 'skipped')]
          summary = {
              'schema_version': 1,
              'workflow': os.environ['WORKFLOW'],
              'event': os.environ['EVENT'],
              'ref': os.environ['REF'],
              'sha': os.environ['SHA'],
              'run_id': os.environ['RUN_ID'],
              'run_attempt': os.environ['RUN_ATTEMPT'],
              'jobs': jobs,
              'failed_jobs': failed,
              'status': 'success' if not failed else 'failure',
              'note': 'Full-locked build/test evidence is inside build/ci-local/*.json; '
                      'this summary only aggregates job results.',
          }
          evidence_dir = workspace / 'build' / 'ci-evidence'
          evidence_dir.mkdir(parents=True, exist_ok=True)
          (evidence_dir / 'ci-evidence.json').write_text(json.dumps(summary, indent=2) + '\n')
          print(json.dumps(summary, indent=2))
          if failed:
              raise SystemExit('failed jobs: ' + ', '.join(failed))
          PY
      - name: Upload CI evidence artifact
        if: success() || failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-evidence-${{ github.sha }}
          path: build/ci-evidence/
          if-no-files-found: error
          retention-days: 30
