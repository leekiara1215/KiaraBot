# P14a-2 default target deployment: single-host Docker Compose (user-confirmed default).
#
# Single host runs PostgreSQL, the four data/control-plane services, Control API, Panel and
# the execution plane (Plugin Host + Adapter). Each service remains its own container with
# its own TLS material, credentials and database permission boundary; only loopback ports
# are published. Docker Compose >= 2.24 is required for `include`.
#
# Start the single-host stack:
#   docker compose --env-file deploy/target.env -f deploy/compose.target.yml \
#     --profile exec up -d
# The explicit `init` profile is one-shot and is never started by `up -d`:
#   docker compose --env-file deploy/target.env -f deploy/compose.target.yml \
#     --profile init run --rm init-identity
#
# Optional two-host topology (deferred; cross-host fault drills not validated):
#   Host-A: compose.infra.yml + compose.core.yml
#   Host-B: compose.exec.yml --profile host --profile adapter (or split host/adapter)
# The profiles "host"/"adapter" in compose.exec.yml exist for that optional split; the
# single-host default uses the combined "exec" profile.
name: ${COMPOSE_PROJECT_NAME:-kiarabot-target}

include:
  - compose.infra.yml
  - compose.core.yml
  - compose.exec.yml

# BOOT-04 controlled bootstrap delivery. Control is the only writer; Host and Adapter mount the
# same delivery root read-only. Every recipient directory is a fixed offline mapping from
# `deploy/control/secret-recipients.example.json`; no request can choose a path, URL, owner or
# command. Secret plaintext appears only in the Control sink's 0600 `<peer>.bootstrap` files and in
# the consumer's read-only mount; it is never in argv, Compose interpolation, images, or diagnostics.
# The Plugin Host `host.credential_directory` config value must point at the consumer mount path.
services:
  control:
    volumes:
      - ${KIARABOT_DELIVERY_DIR:-./target/delivery}:/var/lib/kiarabot-control/delivery
  plugin-host:
    volumes:
      - ${KIARABOT_DELIVERY_DIR:-./target/delivery}:/var/lib/kiarabot-host/credentials:ro
  adapter:
    environment:
      # Existing deployments keep the isolated docker-secret file. Controlled delivery deployments
      # set this to /run/secrets/delivery/<adapter_instance_id>.bootstrap (the fixed peer file).
      BRIDGE_BOOTSTRAP_CREDENTIAL_FILE: ${KIARABOT_ADAPTER_BOOTSTRAP_CREDENTIAL_FILE:-/run/secrets/adapter-bootstrap}
    volumes:
      - ${KIARABOT_DELIVERY_DIR:-./target/delivery}:/run/secrets/delivery:ro
