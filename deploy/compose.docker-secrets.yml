# Optional P14a-2 Docker secrets override. The default deployment uses read-only file mounts
# for all deployment material (config/tls/secrets directories). Operators that choose Docker
# secrets instead must also point the service config JSON secret file paths at
# /run/secrets/<name> (or use a generated config variant); KMS/hot rotation remains deferred.
#
# Usage (single-host):
#   docker compose --env-file deploy/target.env \
#     -f deploy/compose.target.yml -f deploy/compose.docker-secrets.yml \
#     --profile exec up -d
#
# Secrets are files on the host with mode 0600 and are mounted read-only into /run/secrets.
# They are never baked into images and never committed.
secrets:
  postgres-superuser:
    file: ${KIARABOT_PG_SUPERUSER_PASSWORD_FILE:?set KIARABOT_PG_SUPERUSER_PASSWORD_FILE}
  identity-migration:
    file: ${KIARABOT_IDENTITY_MIGRATION_PASSWORD_FILE:?set identity migration password file}
  identity-runtime:
    file: ${KIARABOT_IDENTITY_RUNTIME_PASSWORD_FILE:?set identity runtime password file}
  runtime-migration:
    file: ${KIARABOT_RUNTIME_MIGRATION_PASSWORD_FILE:?set runtime migration password file}
  runtime-runtime:
    file: ${KIARABOT_RUNTIME_RUNTIME_PASSWORD_FILE:?set runtime runtime password file}
  scheduler-migration:
    file: ${KIARABOT_SCHEDULER_MIGRATION_PASSWORD_FILE:?set scheduler migration password file}
  scheduler-runtime:
    file: ${KIARABOT_SCHEDULER_RUNTIME_PASSWORD_FILE:?set scheduler runtime password file}
  model-migration:
    file: ${KIARABOT_MODEL_MIGRATION_PASSWORD_FILE:?set model migration password file}
  model-runtime:
    file: ${KIARABOT_MODEL_RUNTIME_PASSWORD_FILE:?set model runtime password file}
  admin:
    file: ${KIARABOT_ADMIN_PASSWORD_FILE:?set admin password file}
  identity-verification-key:
    file: ${KIARABOT_IDENTITY_VERIFICATION_KEY_FILE:?set identity verification key file}
  model-root-key:
    file: ${KIARABOT_MODEL_ROOT_KEY_FILE:?set model root key file}
  adapter-bootstrap:
    file: ${KIARABOT_ADAPTER_BOOTSTRAP_FILE:?set adapter bootstrap file}
  onebot-access-token:
    file: ${KIARABOT_ONEBOT_TOKEN_FILE:?set onebot access token file}

services:
  postgres:
    secrets:
      - source: postgres-superuser
        target: postgres-superuser
  identity:
    secrets:
      - source: identity-migration
        target: identity-migration
        mode: 0400
      - source: identity-runtime
        target: identity-runtime
        mode: 0400
      - source: admin
        target: admin
        mode: 0400
      - source: identity-verification-key
        target: identity-verification-key
        mode: 0400
  runtime:
    secrets:
      - source: runtime-migration
        target: runtime-migration
        mode: 0400
      - source: runtime-runtime
        target: runtime-runtime
        mode: 0400
  scheduler:
    secrets:
      - source: scheduler-migration
        target: scheduler-migration
        mode: 0400
      - source: scheduler-runtime
        target: scheduler-runtime
        mode: 0400
  model:
    secrets:
      - source: model-migration
        target: model-migration
        mode: 0400
      - source: model-runtime
        target: model-runtime
        mode: 0400
      - source: model-root-key
        target: model-root-key
        mode: 0400
