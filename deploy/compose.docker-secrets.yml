# Optional /run/secrets aliases for the same per-consumer host files used by the
# target deployment. Set the corresponding paths in owner config JSON when using
# aliases. The identity-bootstrap tool reads the same Identity config as the daemon.
# PostgreSQL and Adapter already use Compose secrets in the default deployment.
secrets:
  identity-runtime:
    file: ${KIARABOT_IDENTITY_RUNTIME_PASSWORD_FILE:-${KIARABOT_SECRETS_DIR:-./target/secrets}/identity-runtime.pass}
  identity-token:
    file: ${KIARABOT_IDENTITY_TOKEN_FILE:-${KIARABOT_SECRETS_DIR:-./target/secrets}/token.hex}
  identity-request:
    file: ${KIARABOT_IDENTITY_REQUEST_FILE:-${KIARABOT_SECRETS_DIR:-./target/secrets}/request.hex}
  identity-receipt:
    file: ${KIARABOT_IDENTITY_RECEIPT_FILE:-${KIARABOT_SECRETS_DIR:-./target/secrets}/receipt.hex}
  identity-verification-key:
    file: ${KIARABOT_IDENTITY_VERIFICATION_KEY_FILE:-${KIARABOT_SECRETS_DIR:-./target/secrets}/delegation.pem}
  identity-signing-key:
    file: ${KIARABOT_IDENTITY_SIGNING_KEY_FILE:-${KIARABOT_SECRETS_DIR:-./target/secrets}/delegation.key}
  runtime-runtime:
    file: ${KIARABOT_RUNTIME_RUNTIME_PASSWORD_FILE:-${KIARABOT_SECRETS_DIR:-./target/secrets}/runtime-runtime.pass}
  scheduler-runtime:
    file: ${KIARABOT_SCHEDULER_RUNTIME_PASSWORD_FILE:-${KIARABOT_SECRETS_DIR:-./target/secrets}/scheduler-runtime.pass}
  model-runtime:
    file: ${KIARABOT_MODEL_RUNTIME_PASSWORD_FILE:-${KIARABOT_SECRETS_DIR:-./target/secrets}/model-runtime.pass}
  model-root-key:
    file: ${KIARABOT_MODEL_ROOT_KEY_FILE:-${KIARABOT_SECRETS_DIR:-./target/secrets}/model-root-key.hex}
  identity-migration:
    file: ${KIARABOT_IDENTITY_MIGRATION_PASSWORD_FILE:-${KIARABOT_SECRETS_DIR:-./target/secrets}/identity-migration.pass}
  runtime-migration:
    file: ${KIARABOT_RUNTIME_MIGRATION_PASSWORD_FILE:-${KIARABOT_SECRETS_DIR:-./target/secrets}/runtime-migration.pass}
  scheduler-migration:
    file: ${KIARABOT_SCHEDULER_MIGRATION_PASSWORD_FILE:-${KIARABOT_SECRETS_DIR:-./target/secrets}/scheduler-migration.pass}
  model-migration:
    file: ${KIARABOT_MODEL_MIGRATION_PASSWORD_FILE:-${KIARABOT_SECRETS_DIR:-./target/secrets}/model-migration.pass}
  admin:
    file: ${KIARABOT_ADMIN_PASSWORD_FILE:-${KIARABOT_SECRETS_DIR:-./target/secrets}/admin.pass}

services:
  identity:
    secrets:
      - identity-runtime
      - identity-token
      - identity-request
      - identity-receipt
      - identity-verification-key
      - identity-signing-key
  runtime:
    secrets:
      - runtime-runtime
  scheduler:
    secrets:
      - scheduler-runtime
  model:
    secrets:
      - model-runtime
      - model-root-key
  identity-bootstrap:
    command: ["/usr/local/bin/kiarabot-identity-bootstrap", "--config", "/etc/kiarabot/identity.json", "--enrollment", "/etc/kiarabot/enrollment.json", "--password-file", "/run/secrets/admin"]
    secrets:
      - identity-runtime
      - identity-token
      - identity-request
      - identity-receipt
      - identity-verification-key
      - identity-signing-key
      - admin
  init-identity:
    environment:
      KIARABOT_MIGRATION_PASSWORD_FILE: /run/secrets/identity-migration
    secrets:
      - identity-migration
  init-runtime:
    environment:
      KIARABOT_MIGRATION_PASSWORD_FILE: /run/secrets/runtime-migration
    secrets:
      - runtime-migration
  init-scheduler:
    environment:
      KIARABOT_MIGRATION_PASSWORD_FILE: /run/secrets/scheduler-migration
    secrets:
      - scheduler-migration
  init-model:
    environment:
      KIARABOT_MIGRATION_PASSWORD_FILE: /run/secrets/model-migration
    secrets:
      - model-migration
