[project]
name = "kiarabot-sdk"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = ["grpcio==1.85.0", "protobuf==6.33.6"]

[dependency-groups]
dev = ["grpcio-tools==1.81.1", "pytest==9.2.0", "pytest-asyncio==1.4.1"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["src", "build/generated", "../../plugins/event-observer",
    "../../plugins/ai-reply", "../../plugins/group_admin", "../../plugins/reminder"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
